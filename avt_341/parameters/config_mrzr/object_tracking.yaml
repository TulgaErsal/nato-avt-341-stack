camera_frame: "flir_camera"
frame_prefix: ""
world_frame: "map"
odometry_child_frame: "odom"
tracking_rate: 10.0
filters_kalman_rate: 20.0
filters_kalman_process: 0.01
filters_kalman_measurement: 1.1
camera_target_height: 1.9       # known height of the tracked vehicle [m]
camera_bbox_pixel_sigma: 4.0    # bounding-box measurement uncertainty [px]
filters_use_manual_roi: true
filters_manual_roi_size: [5.0, 5.0, 5.0]
tracker_autostart: true
tracker_use_mission_manager: true
tracker_target_classes: ['car']
tracker_toi_regex: '^TI_'                                       # Object ids matching this regex are considered TOI objects which may trigger an investigation task when encountered.
tracker_allow_generic: false                                    # If true, will track generic targets not part of formation vehicles or toi objects.
tracker_use_multi_tracking: false
tracker_timeout: 5.0

# Obstacle detector integration (embedded in tracking node)
# ======================================================================================================================
od_robot_base_link: 'mrzr/base_link'                           # base link of the ego vehicle (used for TF and body exclusion box)
od_use_pca_box: true                                           # use PCA bounding box to align clusters
od_use_tracking: true                                          # use tracking to assign bbox IDs
od_voxel_grid_size: 0.2                                        # voxel grid leaf size [m]
od_roi_max_x: 40.0                                             # ROI maximum x [m]
od_roi_max_y: 30.0                                             # ROI maximum y [m]
od_roi_max_z: 3.0                                              # ROI maximum z [m]
od_roi_min_x: -10.0                                            # ROI minimum x [m]
od_roi_min_y: -30.0                                            # ROI minimum y [m]
od_roi_min_z: -2.5                                             # ROI minimum z [m]
od_body_max_x: 1.3                                             # ego-body exclusion box maximum x [m]
od_body_max_y: 1.0                                             # ego-body exclusion box maximum y [m]
od_body_max_z: 2.0                                             # ego-body exclusion box maximum z [m]
od_body_min_x: -2.2                                            # ego-body exclusion box minimum x [m]
od_body_min_y: -1.0                                            # ego-body exclusion box minimum y [m]
od_body_min_z: -0.3                                            # ego-body exclusion box minimum z [m]
od_ground_normal_x: 0.0                                        # ground plane normal x component
od_ground_normal_y: 0.0                                        # ground plane normal y component
od_ground_normal_z: 1.0                                        # ground plane normal z component
od_ground_normal_threshold: 0.4                                # threshold for ground point segmentation
od_obstacle_scale: 1.0                                         # neighbor search scale [m]
od_obstacle_min_neighbors: 10                                  # minimum neighboring obstacle points
od_cluster_threshold: 0.5                                      # Euclidean cluster separation distance [m]
od_cluster_min_size: 50                                        # minimum cluster size [points]
od_cluster_max_size: 1000                                      # maximum cluster size [points]
od_displacement_threshold: 1.0                                 # max displacement between frames for tracking [m]
od_iou_threshold: 1.0                                          # IoU threshold for tracking
od_publish_cluster_cloud: true                                 # publish obstacle cluster point cloud
od_publish_ground_cloud: false                                 # publish ground point cloud

obstacle_association_max_dist: 5.0                             # max distance [m] to associate a marker with the camera detection
lidar_reacquire_max_time: 0.5                                  # max elapsed time [s] to re-acquire a briefly lost obstacle by proximity
lidar_reacquire_max_dist: 3.0                                  # max world-frame distance [m] for re-acquisition of a re-labeled obstacle
sync_enable: true
sync_use_callback: false
sync_detection: 0.1
publish_odometry: true
publish_detection: true
publish_image: true

# IMM model probabilities and Markov transition probability.
# CV model is preferred for straight-line driving; CTR kicks
# in when the likelihood of turning becomes higher.
filters_imm_cv_init_prob: 0.33
filters_imm_ctr_init_prob: 0.33
filters_imm_nm_init_prob: 0.33
filters_imm_persistence_prob: 0.9

recovery_no_movement:
    enable: true                                                # Enable recovery triggered by erroneous no-movement detection.
    threshold: 0.2                                              # Velocity threshold under which no-movement flag is set. Will then check if target vehicle is actually moving. If belief disagrees, triggers recovery.
    window_time: 5.0                                            # Time window over which to check if velocity threshold met against running average.
    check_in_states: ['lidar_only', 'camera_only', 'full']      # List of states where no-movement check is performed.
    backoff_time: 5.0                                           # Time to wait before re-triggering no movement check. No-movement check involves making a service call to confirm no movement with target vehicle.

recovery_timeout:
    enable: true                                                # Lost is triggered when no valid measurement arrives for tracker_timeout seconds after sustained active tracking (e.g. target left the sensor field of view), instead of the tracker silently decaying to inactive.
    allow_never_tracked: false                                  # Also trigger when the target was never acquired at all. Useful when vehicles are commanded to track each other from far away, where no initial measurement is ever expected.
    max_attempts: 3                                             # Consecutive timeout-triggered recoveries without sustained re-acquisition before giving up (tracker then decays to inactive as before).

recovery_uncertainty:
    enable: true                                                # Enable recovery triggered by high uncertainty.
    threshold: 5.0                                              # Threshold (in meters) above which uncertainty flag is set. Standard deviation along the axis of largest variance of the x/y position covariance.
    window_time: 5.0                                            # Time window over which to check if uncertainty threshold met against running average.
