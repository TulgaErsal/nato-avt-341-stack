# General
# ======================================================================================================================
goal_dist: 5.0                                # Lookahead threshold within which next waypoint selected.
shutdown_behavior: 1                          # Behavior upon reaching goal (1 - go idle, 2 - stop and shutdown, 3 - hard stop and shutdown).
auto_active_on_new_waypoint: True             # Automatically set navstsack to active state on new goal received. If false, seperate activate command must be sent in addition to target waypoint.
verbose_gp_log: True                          # Activates verbose logging for global planner.
max_separation: 1.0                           # Maximum separation between waypoints [m].
use_global_path: True                         # Whether global planner is using A*(true) or waypoints(false)
map_topic: avt_341/occupancy_grid_low_res             # Occupancy map topic

# Potential Field Planner
# ======================================================================================================================
pf_rate: 10.0                         # Planning rate
obstacle_cost_thresh: 50              # Threshold for making something an obstacle (0-100), primarily for use with segmentation grid
kp: 10.0                              # Attractive potential coeff
eta: 7.5                              # Repulsive potential coeff
cutoff_dist: 40.0                     # obstacles farther than this are ignored
inner_cutoff_dist: 0.0                # Obstacles closer than this are ignored
motion_model_res: 0.25                 # Step size for the motion model in meters