symbols:
  vehicles:
    - 'mrzr'
  position_keys:
    - 'x'
    - 'y'
    - 'z'
  orientation_keys:
    - 'roll'
    - 'pitch'
    - 'yaw'
  accel_items:
    - name: 'forward_accel'
      field: 'x'
    - name: 'lateral_accel'
      field: 'y'
    - name: 'vertical_accel'
      field: 'z'
  wheels:
    - 'fl'
    - 'fr'
    - 'rl'
    - 'rr'

log_topics:

  # ==========================================================================================================
  # VEHICLE STATE TOPICS
  # ==========================================================================================================

  # Local position of the vehicle CG in the x,y,z axis
  - name: '{vehicles}_{position_keys}'
    topic: '/{vehicles}/avt_341/odometry'
    field: 'pose.pose.position.{position_keys}'
    type: 'nav_msgs/msg/Odometry'
    units: 'm'

  # Orientation of the vehicle body about x,y,z axis (roll, pitch, yaw)
  - name: '{vehicles}_{orientation_keys}'
    topic: '/{vehicles}/avt_341/odometry'
    field: 'pose.pose.orientation'
    type: 'nav_msgs/msg/Odometry'

  # Acceleration of the vehicle CG in the x,y,z axis
  - name: '{vehicles}_{accel_items.name}'
    topic: '/{vehicles}/avt_341/vehicle_cg/accel'
    field: 'accel.linear.{accel_items.field}'
    type: 'geometry_msgs/msg/AccelStamped'
    units: 'm/s^2'

  # Speed of the vehicle CG in the x-axis
  - name: '{vehicles}_forward_speed'
    topic: '/{vehicles}/avt_341/forward_speed'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: 'm/s'

  # Front wheel angle position
  - name: '{vehicles}_steering_angle'
    topic: '/{vehicles}/steering_angle'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: 'rad'

  # Throttle position
  - name: '{vehicles}_throttle'
    topic: '/{vehicles}/throttle'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: '%'

  # Engine torque output
  - name: '{vehicles}_engine_torque'
    topic: '/{vehicles}/engine_torque'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: 'Nm'

  # Engine speed output
  - name: '{vehicles}_engine_speed'
    topic: '/{vehicles}/engine_speed'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: 'rpm'

  # Brake position
  - name: '{vehicles}_brake'
    topic: '/{vehicles}/brake'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: '%'

  # Rotational speed of the wheels
  - name: '{vehicles}_wheel_rot_speed_{wheels}'
    topic: '/{vehicles}/wheel_speed/{wheels}'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: 'rpm'

  # ==========================================================================================================
  # VEHICLE COMMAND TOPICS
  # ==========================================================================================================

  # Desired Steering Angle (Front Wheel)
  - name: '{vehicles}_desired_steering_angle'
    topic: '/{vehicles}/avt_341/cmd_vel'
    field: 'angular.z'
    type: 'geometry_msgs/msg/Twist'
    units: 'rad'

  # Desired Throttle Position
  - name: '{vehicles}_desired_throttle'
    topic: '/{vehicles}/avt_341/cmd_vel'
    field: 'linear.x'
    type: 'geometry_msgs/msg/Twist'
    units: '%'

  # Desired Brake pressure or Pedal Position
  - name: '{vehicles}_desired_brake'
    topic: '/{vehicles}/avt_341/cmd_vel'
    field: 'linear.y'
    type: 'geometry_msgs/msg/Twist'
    units: '%'

  # Local Planned Path Way Points X, Y
  - name: '{vehicles}_local_planned_path_{position_keys[:2]}'
    topic: '/{vehicles}/avt_341/local_path'
    field: 'poses.pose.position.{position_keys[:2]}'
    type: 'nav_msgs/msg/Path'
    units: 'm'

  # Desired lateral speed
  - name: '{vehicles}_desired_lateral_speed'
    topic: ''
    field: ''
    type: ''
    units: 'm/s'

  # Desired yaw rate
  - name: '{vehicles}_desired_yaw_rate'
    topic: ''
    field: ''
    type: ''
    units: 'rad/s'

  # Desired heading angle (desiredHeading)
  - name: '{vehicles}_desired_heading_angle'
    topic: ''
    field: ''
    type: ''
    units: 'deg'

  # Desired longitudinal speed
  - name: '{vehicles}_desired_longitudinal_speed'
    topic: '/{vehicles}/avt_341/speed_setpoint'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: 'm/s'

  # Desired longitudinal acceleration
  - name: '{vehicles}_desired_longitudinal_accel'
    topic: ''
    field: ''
    type: ''
    units: 'm/s^2'

  # Perceived Chassis CG X, Y, Z of Lead Vehicle
  - name: 'lead_{position_keys}'
    topic: ''
    field: ''
    type: ''
    units: 'm'

  # Perceived Chassis Yaw Angle of Lead Vehicle
  - name: 'lead_yaw'
    topic: ''
    field: ''
    type: ''
    units: 'deg'

  # Perceived Vehicle Forward Speed of Lead Vehicle
  - name: 'lead_speed'
    topic: ''
    field: ''
    type: ''
    units: 'm/s'

  # Occupancy Grid
  - name: '{vehicles}_occupancy_grid'
    topic: '/{vehicles}/avt_341/occupancy_grid'
    field: ''
    type: 'nav_msgs/msg/OccupancyGrid'