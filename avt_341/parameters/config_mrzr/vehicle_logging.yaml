log_topics:
  # Local position of the vehicle CG in the x-axis
  - name: 'x'
    topic: '/mrzr/avt_341/odometry'
    field: 'pose.pose.position.x'
    type: 'nav_msgs/msg/Odometry'
    units: 'm'
  # Local position of the vehicle CG in the y-axis
  - name: 'y'
    topic: '/mrzr/avt_341/odometry'
    field: 'pose.pose.position.y'
    type: 'nav_msgs/msg/Odometry'
    units: 'm'
  # Local position of the vehicle CG in the z-axis
  - name: 'z'
    topic: '/mrzr/avt_341/odometry'
    field: 'pose.pose.position.z'
    type: 'nav_msgs/msg/Odometry'
    units: 'm'
  # Orientation of the vehicle body about the x-axis
  - name: 'roll'
    topic: ''
    field: ''
    type: ''
    units: 'rad'
  # Orientation of the vehicle body about the y-axis
  - name: 'pitch'
    topic: ''
    field: ''
    type: ''
    units: 'rad'
  # Orientation of the vehicle body about the z-axis
  - name: 'yaw'
    topic: ''
    field: ''
    type: ''
    units: 'rad'
  # Acceleration of the vehicle CG in the x-axis
  - name: 'forward_accel'
    topic: '/mrzr/avt_341/vehicle_cg/accel'
    field: 'accel.linear.x'
    type: 'geometry_msgs/msg/AccelStamped'
    units: 'm/s^2'
  # Acceleration of the vehicle CG in the y-axis
  - name: 'lateral_accel'
    topic: '/mrzr/avt_341/vehicle_cg/accel'
    field: 'accel.linear.y'
    type: 'geometry_msgs/msg/AccelStamped'
    units: 'm/s^2'
  # Acceleration of the vehicle CG in the z-axis
  - name: 'vertical_accel'
    topic: '/mrzr/avt_341/vehicle_cg/accel'
    field: 'accel.linear.z'
    type: 'geometry_msgs/msg/AccelStamped'
    units: 'm/s^2'
  # Speed of the vehicle CG in the x-axis
  - name: 'forward_speed'
    topic: '/mrzr/mrzr_velocity'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: 'm/s'
  # Front wheel angle position
  - name: 'steering_angle'
    topic: '/cmd_vel'
    field: 'angular.z'
    type: 'geometry_msgs/msg/Twist'
    units: 'rad'
  # Throttle position
  - name: 'throttle'
    topic: '/throttle_out'
    field: 'percent'
    type: 'mrak_msgs/msg/Throttle'
    units: '%'
  # Engine torque output
  - name: 'engine_torque'
    topic: ''
    field: ''
    type: ''
    units: 'Nm'
  # Engine speed output
  - name: 'engine_speed'
    topic: '/mrzr/engine_speed_rpm'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: 'rpm'
  # Brake position
  - name: 'brake'
    topic: '/brake_out'
    field: 'percent'
    type: 'mrak_msgs/msg/Brake'
    units: '%'
  # Rotational speed of the front-left wheel
  - name: 'wheel_rot_speed_fl'
    topic: '/wheel_speed/fl'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: 'rpm'
  # Rotational speed of the front-right wheel 
  - name: 'wheel_rot_speed_fr'
    topic: '/wheel_speed/fr'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: 'rpm'
  # Rotational speed of the rear-left wheel 
  - name: 'wheel_rot_speed_rl'
    topic: '/wheel_speed/rl'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: 'rpm'
  # Rotational speed of the rear-right wheel
  - name: 'wheel_rot_speed_rr'
    topic: '/wheel_speed/rr'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: 'rpm'
  # Desired Steering Angle (Front Wheel)
  - name: 'desired_steering_angle'
    topic: '/mrzr/avt_341/cmd_vel'
    field: 'angular.z'
    type: 'geometry_msgs/msg/Twist'
    units: 'rad'
  # Desired Throttle Position
  - name: 'desired_throttle'
    topic: '/mrzr/avt_341/cmd_vel'
    field: 'linear.x'
    type: 'geometry_msgs/msg/Twist'
    units: '%'
  # Desired Brake pressure or Pedal Position
  - name: 'desired_brake'
    topic: '/mrzr/avt_341/cmd_vel'
    field: 'linear.y'
    type: 'geometry_msgs/msg/Twist'
    units: '%'
  # Local Planned Path Way Points X
  - name: 'local_planned_path_x'
    topic: '/mrzr/avt_341/local_path'
    field: 'poses.pose.position.x'
    type: 'nav_msgs/msg/Path'
    units: 'm'
  # Local Planned Path Way Points Y
  - name: 'local_planned_path_y'
    topic: '/mrzr/avt_341/local_path'
    field: 'poses.pose.position.y'
    type: 'nav_msgs/msg/Path'
    units: 'm'
  # Desired lateral speed
  - name: 'desired_lateral_speed'
    topic: ''
    field: ''
    type: ''
    units: 'm/s'
  # Desired yaw rate
  - name: 'desired_yaw_rate'
    topic: ''
    field: ''
    type: ''
    units: 'rad/s'
  # Desired heading angle (desiredHeading)
  - name: 'desired_heading_angle'
    topic: ''
    field: ''
    type: ''
    units: 'deg'
  # Desired longitudinal speed
  - name: 'desired_longitudinal_speed'
    topic: '/mrzr/avt_341/speed_setpoint'
    field: 'data'
    type: 'std_msgs/msg/Float64'
    units: 'm/s'
  # Desired longitudinal acceleration
  - name: 'desired_longitudinal_accel'
    topic: ''
    field: ''
    type: ''
    units: 'm/s^2'
  # Perceived Chassis CG X
  - name: 'lead_x'
    topic: ''
    field: ''
    type: ''
    units: 'm'
  # Perceived Chassis CG Y
  - name: 'lead_x'
    topic: ''
    field: ''
    type: ''
    units: 'm'
  # Perceived Chassis CG Z
  - name: 'lead_x'
    topic: ''
    field: ''
    type: ''
    units: 'm'
  # Perceived Chassis Yaw Angle
  - name: 'lead_yaw'
    topic: ''
    field: ''
    type: ''
    units: 'deg'
  # Perceived Vehicle Forward Speed
  - name: 'lead_speed'
    topic: ''
    field: ''
    type: ''
    units: 'm/s'