# Road-centerlined constrained planner
# ======================================================================================================================
num_paths: 41                           # Number of candidate paths to be generated.

# Dynamic window
use_dynamic_window: True                # Enable dynamic window
time_look_ahead: 3.0                    # Look ahead time [s] (lookahead_dist [m] = time_look_ahead [s] * speed [m/s])
min_path_look_ahead: 10.0               # Minimum path lookahead [m]
max_path_look_ahead: 50.0               # Maximum path lookahead [m]
path_look_ahead: 20.0                   # Default planning horizon (used if use_dynamic_window=false or no speed is received).
max_lateral_accel: 8.5                  # Maximum lateral acceleration [m/s^s] (steer_angle_limit = atan(vehicle_wheelbase * max_lateral_accel / speed^2))
min_steer_angle_limit: 0.1              # Minimum steering angle limit [rad]
max_steer_angle_limit: 0.69             # Maximim steering angle limit [rad]
steer_angle_limit: 0.69                 # Steer angle limit in radians (used if use_dynamic_window=false or no speed is received).

vehicle_wheelbase: 2.012                # Vehicle wheelbase [m]
vehicle_width: 5.0 #1.511               # Vehicle width.
max_theta: 1.0                          # Maximum angle difference (in radians) between heading and goal used for generating paths.
output_path_step: 0.5                   # Output path step size.
path_integration_step: 0.35             # Path integration step size.
dilation_factor: 0                      # Dilation to costmap to apply during local planning only.
w_c: 0.0                                # w_c conformability (minimize curvature) weighting factor
w_s: 0.5                                # w_s static safety (avoid collisions) weighting factor
w_d: 0.0                                # w_d dynamic safety weighting factor
w_r: 0.2                                # w_r rho (minimize rho offset) weighting factor
w_t: 0.0                                # w_t segmentation cost weight
rcc_rate: 10.0                          # Planner update rate [Hz]
trim_path: False                        # Whether or not to trim path
use_global_path: True                   # Whether local planner should use path output from global planner for its road centerline or use simple line connecting waypoints
use_blend: True                         # Whether or not to apply blending with adjacent candidate paths during planning
cost_vis: 'none'                        # What type of cost to display on candidate paths: none | final | components | all
cost_vis_text_size: 2.0                 # Cost vis text size
ignore_coll_before_dist: 0.5            # Distance before which collisions are ignored in local planner candidate paths.
map_topic: avt_341/occupancy_grid           # Occupancy grid topic