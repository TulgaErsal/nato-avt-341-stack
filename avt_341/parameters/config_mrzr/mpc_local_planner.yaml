sysimage_path: "" # Filepath to the Julia sysimage
planner_module_path: "" # Filepath to the Julia MPC planner module
parameters_module_path: "" # Filepath to the Julia MPC parameters module
models_module_path: "" # Filepath to the Julia MPC models module

rate: 20.0 # Planner update rate

tire_model: "P" # L for linear, P for Pacejka, N for neural network for deformable terrain

num_col_points: 10 # number of collocation points to use in MPC
prediction_time_horizon: 2.0 # MPC prediction time horizon [s]
max_num_obs: 500 # maximum number of obstacles allowed in MPC
max_num_seg: 2000 # maximum number of obstacles allowed in MPC
min_speed: 0.5 # minimum allowed vehicle speed [m/s]
max_speed: 3.5 # maximum allowed vehicle speed [m/s]

use_hard_constraints: False # whether to include obstacles as hard constraints in addition to soft constraints
use_segmentation: False
segmentation_resolution: 0.25
linear_solver: "ma27" # See https://coin-or.github.io/Ipopt/OPTIONS.html#OPT_linear_solver for list of linear solvers. Recommended: 'ma27'. Default: 'mumps'

w_distance_to_obstacles: 50. # weight on distanceToObstacles in the objective function
w_distance_to_goal: 150. # weight on distanceToGoal in the objective function
w_deviation_in_yaw: 1. # weight on deviationInYaw in the objective function
w_yaw_accel: 0.8 #  weight on yawAccel in the objective function
w_traversability_cost: 0.1  #weight on traversability cost in the objective function
w_final_speed: 200. # weight on deviationFromDesiredFinalSpeed in the objective function

safety_margin: 0.0 # safety margin [m] around obstacles
grid_resolution: 0.25 # resolution of the occupancy grid [m]

always_publish_goal: False # always publish goal (overrides front_angle_goal)
front_angle_goal: 1.571 # the angle measured from the vehicle heading beyond which the goal point is considered not in front of the vehicle [rad]
front_angle_obstacle: 1.571 # the angle measured from the vehicle heading beyond which an obstacle is considered not in front of the vehicle [rad]
front_angle_segmentation: 1.571 # the angle measured from the vehicle heading beyond which segmentation data is considered not in front of the vehicle [rad]
goal_lookahead_time_padding: 0.5 # additional time padding added to the goal lookahead distance [s]
use_goal_lookahead_maxspeed: False # if true the max_speed will be used to select an intermediate waypoint at (planning_horizon+padding)*speed distance along the global path. Else, the current speed will be used.

adaptive: False # whether to use the terrain adaptive formulation or not

vehicle_axle_distance_front: 1.38599  # [m]

obstacles_vizualize: True # Publish obstacle visualization messages

traversability_threshold: 40
project_segmentation_onto_occupancy_grid: False

slope_threshold: 0.2
rms_threshold: 0.05
speed_around_large_slopes_and_rms: 4.0

sa_min: -0.628319        # Minimum steering angle constraint for MPC planner
sa_max: 0.628319         # Maximum steering angle constraint for MPC planner
sr_min: -0.523        # Minimum steering rate constraint for MPC planner
sr_max: 0.523         # Maximum steering rate constraint for MPC planner
