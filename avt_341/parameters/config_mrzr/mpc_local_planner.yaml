# Launch parameters for the MPC planner
mpc_rate: 10.0

# Vehicle parameters
mpc_vehicle_mass: 1683.97  # [kg]
mpc_vehicle_yaw_inertia: 10442.53  # [kg m^2]
mpc_vehicle_axle_distance_front: 1.38599  # [m]
mpc_vehicle_axle_distance_rear: 1.38825  # [m]
mpc_vehicle_axle_combined_stiffness_front: 164448.37  # ?? front axle combined stiffness?
mpc_vehicle_axle_combined_stiffness_rear: 164448.37  # ??
mpc_vehicle_relaxation_length: 0.91  # [m]

# Bounds
mpc_bounds_steering_angle_max: 0.5  # [radians]
mpc_bounds_steering_rate_max: 0.5  # [radians/s]
mpc_bounds_yaw_rate_min: -2.0  # [radians/s]
mpc_bounds_yaw_rate_max: 2.0  # [radians/s]
mpc_bounds_lateral_speed_max: 1.0  # [m/s]
mpc_bounds_longitudinal_speed_min: 2.0  # [m/s] Minimum speed allowed. Must be positive.
mpc_bounds_longitudinal_speed_max: 5.0  # [m/s] Maximum speed allowed.
mpc_bounds_longitudinal_acceleration_min: -5.0  # [m/s^2] Minimum allowed acceleration. Can be negative.
mpc_bounds_longitudinal_acceleration_max: 5.0  # [m/s^2] Maximum allowed acceleration.
mpc_bounds_longitudinal_jerk_min: -1.0  # [m/s^3] Minimum allowed jerk. Can be negative.
mpc_bounds_longitudinal_jerk_max: 1.0 # [m/s^3] Maximum allowed jerk in m/s^3.

# Solver options
mpc_solver_name: "ma27"
mpc_solver_max_iterations: 10
mpc_solver_tolerance: 1.0e-3  # From file: 1e-8
mpc_solver_max_wall_time: 5.0  # [s]
mpc_solver_time_span: 2.0  # [s]
mpc_solver_time_step: 0.075  # [s]
mpc_solver_print_level: 0

# Solver weights
mpc_weight_goal: 10.0
mpc_weight_steering_rate: 10.0
mpc_weight_obstacle_term: 1.0
mpc_weight_longitudinal_jerk: 1.0

# Obstacles
mpc_obstacles_max_obstacle_number: 10000
mpc_obstacles_angle: 1.571 # 90 degrees l/r around vehicle
mpc_obstacles_vizualize: True