sysimage_path: "" # Filepath to the Julia sysimage
planner_module_path: "" # Filepath to the Julia MPC planner module
parameters_module_path: "" # Filepath to the Julia MPC parameters module
models_module_path: "" # Filepath to the Julia MPC models module

rate: 10.0 # Planner update rate

tire_model: "L" # L for linear, P for Pacejka, N for neural network for deformable terrain

num_col_points: 10 # number of collocation points to use in MPC
prediction_time_horizon: 2.0 # MPC predition time horizon [s]
max_num_obs: 500 # maximum number of obstacles allowed in MPC
min_speed: 0.5 # minimum allowed vehicle speed [m/s]
max_speed: 3.5 # maximum allowed vehicle speed [m/s]

stop_on_max_solve_time: True # Stop the vehicle when maximum solve time is reached

use_hard_constraints: False # whether to include obstacles as hard constraints in addition to soft constraints

w_distance_to_obstacles: 5. # weight on distanceToObstacles in the objective function
w_distance_to_goal: 100. # weight on distanceToGoal in the objective function
w_deviation_in_yaw: 1. # weight on deviationInYaw in the objective function

safety_margin: 0.0 # safety margin [m] around obstacles
grid_resolution: 0.25 # resulution of the occupancy grid [m]

front_angle_goal: 1.571 # the angle measured from the vehicle heading beyond which the goal point is considered not in front of the vehicle [rad]
front_angle_obstacle: 1.571 # the angle measured from the vehicle heading beyond which an obstacle is considered not in front of the vehicle [rad]

adaptive: False # whether to use the terrain adaptive formulation or not

vehicle_axle_distance_front: 1.38599  # [m]

obstacles_vizualize: True # Publish obstacle vizualization messages