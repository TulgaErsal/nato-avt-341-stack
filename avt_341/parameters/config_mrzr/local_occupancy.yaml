# Local Occupancy Grid
# ======================================================================================================================
local_grid_frame: 'mrzr/base_link'                                            # Local (vehicle) frame
global_grid_frame: 'map'                                                      # Global (fixed) frame
obstacle_points_topic: '/avt_341/lidar_detector/cloud_clusters'               # PointCloud2 topic with detected obstacle points
local_grid_width: 50.0                                                        # Width of the occupancy grid [m]
local_grid_height: 50.0                                                       # Height of the occupancy grid [m]
local_grid_resolution: 1.0                                                    # Resolution of the occupancy grid [m]
dilate_local_grid: False                                                       # Enable dilation of occupancy
local_grid_dilate_x: 1.5                                                      # Dilation amount in x direction
local_grid_dilate_y: 1.5                                                      # Dilation amount in y direction
local_grid_rate: 5.0                                                          # Publish rate