# Potential Field Local Planner
# ======================================================================================================================
use_global_path: True                 # Whether local planner should use path output from global planner for its road centerline or use simple line connecting waypoints
pf_rate: 10.0                         # Planning rate
obstacle_cost_thresh: 50              # Threshold for making something an obstacle (0-100), primarily for use with segmentation grid
kp: 10.0                              # Attractive potential coeff
eta: 7.5                              # Repulsive potential coeff
cutoff_dist: 40.0                     # obstacles farther than this are ignored
inner_cutoff_dist: 0.0                # Obstacles closer than this are ignored
motion_model_res: 0.25                # Step size for the motion model in meters
grid_topic: 'avt_341/local_grid'      # Occupancy grid topic