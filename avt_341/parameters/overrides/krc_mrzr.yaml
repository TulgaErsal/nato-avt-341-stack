# Runtime parameter overrides for the KRC MRZR deployment.
#
# Ordinary rcl parameter file layered on top of the template defaults compiled
# into each node (see parameters/templates/). Section keys are node selectors
# (** = any number of namespace tokens). Values support the avt_341_param_lib
# runtime templating: $python{<expression>} and $ref{<selector>/<param.name>}.
#
# Precedence is document order then file order (later wins) - there is no
# specificity-based precedence in ROS 2, so more-specific sections must be
# placed BELOW broader ones. Never write an empty array here (rcl cannot type
# empty sequences); omit the key so the compiled-in default applies.

/**:
  ros__parameters:
    max_speed: 4.0    # single source for the mpc planner family and the mission manager

/**/mission_manager_node:
  ros__parameters:
    mission_definition_file: $python{os.path.join(get_package_share_directory('avt_341'), 'config', 'krc_mission_points.csv')}
    mission_paths_file: $python{os.path.join(get_package_share_directory('avt_341'), 'config', 'krc_paths - NAD83_m.csv')}

/**/speed_zones_node:
  ros__parameters:
    zones_filepath: $python{os.path.join(get_package_share_directory('avt_341'), 'config', 'krc_speed_zones - NAD83_m.csv')}

# perception_local_node runs on the template defaults (donor: legacy perception_local.yaml)

/**/perception_global_node:
  ros__parameters:
    costmap:
      size_info:
        res: 0.5
      dilation:
        x: 0.5
        y: 0.5
    publish:
      max_grid_width: 800.0
      max_grid_height: 800.0
    clear_method:
      voxel_height_res: 1.0
      obj_range_filter: 0.5

/**/perception_rms_node:
  ros__parameters:
    costmap:
      size_info:
        res: 1.0
      dilation:
        x: 0.5
        y: 0.5
      terrain_rms:
        hfov: 1.0472
        range: 15.0
        time_window: 0.05
    publish:
      max_grid_width: 800.0
      max_grid_height: 800.0
    point_cloud_layer:
      topic: '/ouster/points'
      clear_topic: 'avt_341/ground_points'
    clear_method:
      type: 'time'
      voxel_height_min: 0.0
      voxel_height_res: 0.5
      max_point_age: 1.0

