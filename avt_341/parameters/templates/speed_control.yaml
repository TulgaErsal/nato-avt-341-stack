code_namespace: avt_341/params/speed_control
ros__parameters:

  # Pure pursuit controller
  # ====================================================================================================================
  vehicle_wheelbase:
    type: double
    default_value: 2.019
    description: "Vehicle wheelbase."
  vehicle_max_steer_angle_degrees:
    type: double
    default_value: 40.0
    description: "Max steer angle in degrees."
  steering_gain:
    type: double
    default_value: 1.0
    description: "Steering angle multiplier."
  vehicle_speed:
    type: double
    default_value: 3.5
    description: "Vehicle speed m/s."
  throttle_coefficient:
    type: double
    default_value: 1.0
    description: "Scale factor for the commanded steering. l.t. 1.0 will make the acceleration less agressive, g.t. 1.0 will make it more agressive."

  # Speed Control
  # ====================================================================================================================
  time_to_max_brake:
    type: double
    default_value: 4.0
    description: "Time in seconds to go from 0 to maximum braking."
  time_to_max_throttle:
    type: double
    default_value: 3.0
    description: "Time in seconds to go from 0 to maximum throttle."
  use_feed_forward:
    type: bool
    default_value: false
    description: "Set to true to use the feed-forward model in the PID throttle control."
  use_speed_controller:
    type: bool
    default_value: false
    description: "Set to true to output throttle/brake commands (linear.x -> throttle percent, linear.y -> brake percent) instead of velocity commands (linear.x -> forward speed [m/s])."
  output_steering_percent:
    type: bool
    default_value: false
    description: "Set to true to output steering commands as a percentage of vehicle_max_steer_angle_degrees (cmd_vel.angular.x -> % steering) instead of the wheel angle (cmd_vel.angular.x -> wheel angle [rad])."
  ff_a0:
    type: double
    default_value: 0.2856
    description: "0th order coeff in the feed-forward model."
  ff_a1:
    type: double
    default_value: 0.0321
    description: "1st order coeff in the feed-forward model."
  ff_a2:
    type: double
    default_value: 0.0
    description: "2nd order coeff in the feed-forward model."
  throttle_kp:
    type: double
    default_value: 1.1
    description: "Proportional coeff for the PID speed controller."
  throttle_ki:
    type: double
    default_value: 0.0
    description: "Integral coeff for the PID speed controller."
  throttle_kd:
    type: double
    default_value: 0.0
    description: "Derivative coeff for the PID speed controller."
  max_desired_lateral_g:
    type: double
    default_value: 0.5
    description: "Controller will limit the speed to try to keep the lateral g-forces under this amount. In fractional units of 9.806 m/s^2."
  turn_off_velocity_overshoot_corrector:
    type: bool
    default_value: false
    description: "Disable velocity overshoot corrector."
  anti_windup_method:
    type: string
    default_value: 'disabled'
    description: "PID integral windup correction method: 'disabled' | 'reset_on_setpoint' | 'integral_clamping'."
    validation:
      one_of<>: [ [ 'disabled', 'reset_on_setpoint', 'integral_clamping' ] ]
  integral_abs_max:
    type: double
    default_value: 1.0
    description: "Max absolute value for PID integral. Only active when anti_windup_method = 'integral_clamping'."
  pid_output_max:
    type: double
    default_value: 1.0
    description: "Max value for PID output."
  pid_output_min:
    type: double
    default_value: 0.0
    description: "Min value for PID output."

  # Display
  # ====================================================================================================================
  display:
    type: string
    default_value: 'rviz'
    description: "Display method to use. When set to 'rviz', publishes the next waypoint marker for rviz display."
