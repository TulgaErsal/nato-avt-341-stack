code_namespace: avt_341/params/pf_global_planner
ros__parameters:

  # General
  # ====================================================================================================================
  goal_dist:
    type: double
    default_value: 5.0
    description: "Lookahead threshold within which next waypoint selected."
  waypoints_x:
    type: double_array
    default_value: []
    description: "X coordinates of the initial global waypoints loaded at startup."
  waypoints_y:
    type: double_array
    default_value: []
    description: "Y coordinates of the initial global waypoints loaded at startup."
  map_origin_x:
    type: double
    default_value: 0.0
    description: "X origin offset subtracted from the startup waypoint coordinates to transform them into the map frame."
  map_origin_y:
    type: double
    default_value: 0.0
    description: "Y origin offset subtracted from the startup waypoint coordinates to transform them into the map frame."
  shutdown_behavior:
    type: int
    default_value: 1
    description: "Behavior upon reaching goal (1 - go idle, 2 - stop w/ gradual brake, 3 - stop with hard brake)."
    validation:
      one_of<>: [ [ 1, 2, 3 ] ]
  auto_active_on_new_waypoint:
    type: bool
    default_value: true
    description: "Automatically set navstsack to active state on new goal received. If false, seperate activate command must be sent in addition to target waypoint."
  verbose_gp_log:
    type: bool
    default_value: true
    description: "Activates verbose logging for global planner."
  max_separation:
    type: double
    default_value: 1.0
    description: "Maximum separation between waypoints [m]."
  use_global_path:
    type: bool
    default_value: true
    description: "Whether global planner is using A*(true) or waypoints(false)"
  map_topic:
    type: string
    default_value: "avt_341/occupancy_grid_low_res"
    description: "Occupancy map topic"

  # Potential Field Planner
  # ====================================================================================================================
  pf_rate:
    type: double
    default_value: 10.0
    description: "Planning rate"
    validation:
      gt_eq<>: [ 0.0 ]
  obstacle_cost_thresh:
    type: int
    default_value: 50
    description: "Threshold for making something an obstacle (0-100), primarily for use with segmentation grid"
    validation:
      bounds<>: [ 0, 100 ]
  kp:
    type: double
    default_value: 10.0
    description: "Attractive potential coeff"
  eta:
    type: double
    default_value: 7.5
    description: "Repulsive potential coeff"
  cutoff_dist:
    type: double
    default_value: 40.0
    description: "obstacles farther than this are ignored"
  inner_cutoff_dist:
    type: double
    default_value: 0.0
    description: "Obstacles closer than this are ignored"
  motion_model_res:
    type: double
    default_value: 0.25
    description: "Step size for the motion model in meters"
