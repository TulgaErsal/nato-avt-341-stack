rate: 5.0

model:
  external: ''
  name: 'statictargetsv8m-cuda-608x608'
  warmup: 30
  classes: ['LandTamer','HH','Bobcat','HMMWV','JLTV']
  device_override: ''     # Options: Empty string, 'cpu', 'cuda'. If empty uses device associated with model.

thresholds:
  score: 0.5
  iou: 0.5
  count: 300

visualizer:
  enabled: True
  textbox: True
  seed: 0
  # Using the key "size.font" in order to keep size options sorted, despite this option affecting the font scale.
  size_font: 0.75
  size_border: 2