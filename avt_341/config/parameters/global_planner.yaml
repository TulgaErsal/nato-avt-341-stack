# Global Planner
# ======================================================================================================================
goal_dist: 5.0                                # Lookahead threshold within which next waypoint selected.
global_lookahead: 75.0                        # Global path lookahead
debug_visualize: False                        # Enables debug visualization of global planner.
w_distance: 1.0                               # Weight for distance cost.
w_occupancy: 1.0                              # Weight for occupancy cost.
w_segmentation: 1.0                           # Weight for segmentation cost.
search_diagonals: False                       # If true, grid search includes adjacent cells that are diagonal. If not, only adjacent cells that are horizontal or vertical are considered.
los_max_iterations: 1                         # Number of iterations to apply line of sight post smoothing. Applying post smoothing multiple times can help remove excessive control points that are added due to jagged obstacle edges.
los_break_on_first: True                      # If true, line of sight post-smoothing only considers first break on line of sight. If false, finds the last line of sight connection.
shutdown_behavior: 2                          # behavior upon reaching goal (1 - go idle, 2 - stop and shutdown, 3 - hard stop and shutdown).
auto_active_on_new_waypoint: True             # Automatically set navstsack to active state on new goal received. If false, seperate activate command must be sent in addition to target waypoint.
verbose_gp_log: False                         # Activates verbose logging for global planner.