camera_frame: "front_camera"
frame_prefix: ""
world_frame: "map"
odometry_child_frame: "odom"
tracking_rate: 10.0
filters_downsampling_leaf_size: 0.3
filters_passthrough_min: 1.0
filters_passthrough_max: 40.0
filters_clustering_tolerance: 0.6
filters_clustering_size_minimum: 50         # minimum point count at the reference distance
filters_clustering_size_maximum: 500
filters_clustering_distance_reference: 10.0  # range [m] at which size_minimum applies; min scales as 1/d^2
filters_clustering_min_height: 1.0           # minimum cluster vertical extent [m]
filters_clustering_max_height: 4.0           # maximum cluster vertical extent [m]
filters_clustering_min_width: 0.1            # minimum cluster left-right extent [m]
filters_clustering_max_width: 4.0            # maximum cluster left-right extent [m]
filters_clustering_min_depth: 0.1            # minimum cluster along-range extent [m]
filters_clustering_max_depth: 6.0            # maximum cluster along-range extent [m]
filters_ground_max_iterations: 50
filters_ground_threshold: 0.2
filters_ground_angle: 3.0
filters_kalman_rate: 20.0
filters_kalman_process: 0.01
filters_kalman_measurement: 0.5
camera_target_height: 2.0       # known height of the tracked vehicle [m]
camera_bbox_pixel_sigma: 4.0    # bounding-box measurement uncertainty [px]
filters_use_manual_roi: true
filters_manual_roi_size: [5.0, 5.0, 5.0]
filters_use_pca_centroid: false
tracker_autostart: true
tracker_use_mission_manager: true
tracker_target_class: mrzr4
tracker_timeout: 5.0
sync_enable: true
sync_use_callback: false
sync_detection: 0.1
publish_clouds_fov: true
publish_clouds_roi: true
publish_clouds_ground: true
publish_clouds_cluster: true
publish_clouds_cropbox: false
publish_pose: true
filters_pose: false
publish_odometry: true
filters_odometry: false
publish_detection: true
publish_image: true

# IMM model probabilities and Markov transition probability.
# CV model is preferred for straight-line driving; CTR kicks
# in when the likelihood of turning becomes higher.
filters_imm_cv_init_prob: 0.33
filters_imm_ctr_init_prob: 0.33
filters_imm_nm_init_prob: 0.33
filters_imm_transition_prob: 0.9