# Workflow to run the ROS2 Humble build every night if source code changed within the day
name: Build ROS2 Humble Linux

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:

  # Based on https://github.com/orgs/community/discussions/27128
  check_date:
    runs-on: ubuntu-22.04
    name: Check for Recent Commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Repository Last Commit
        run: echo ${{ github.sha }}

      - id: should_run
        name: Set if Last Commit Within 24 Hours
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' }}
        run: |
          test -z $(git rev-list --after="24 hours" ${{ github.sha }}) && echo "::set-output name=should_run::false"

  build:
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    name: Build AVT341 Stack
    runs-on: ubuntu-22.04
    steps:

      - name: Install ROS2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: ros_ws/src

      - name: Install ROS Dependencies
        run: |
          sudo apt install -y ros-humble-pcl-ros ros-humble-ackermann-msgs ros-humble-vision-msgs unzip
          wget https://download.pytorch.org/libtorch/nightly/cpu/libtorch-shared-with-deps-latest.zip
          unzip libtorch-shared-with-deps-latest.zip

      # Note: Environment variables do not seem to persist through job steps, need to call source here
      - name: Build repository
        run: |
          export Torch_DIR="$(pwd)/libtorch"
          source /opt/ros/humble/setup.bash
          cd ros_ws
          colcon build --packages-select avt_341_msgs avt_341
          echo "BUILD_DONE=true" >> $GITHUB_ENV
          colcon test --packages-select avt_341 --ctest-args --output-junit test_results/test_results.xml
          colcon test-result --all --verbose | tee test_result_output.txt

      - name: Generate Test Report and Badge
        if: always() && env.BUILD_DONE == 'true'
        run: |
          pip install junit2html

          # Convert JUnit XML to HTML report
          python -m junit2htmlreport ros_ws/build/avt_341/test_results/test_results.xml ros_ws/build/avt_341/test_results/test_results.html

          # Extract total and successful test counts from colcon test-result summary line
          # Format: "Summary: 38 tests, 0 errors, 0 failures, 0 skipped"
          SUMMARY_LINE=$(grep -E "^Summary:" ros_ws/test_result_output.txt)
          TOTAL_TESTS=$(echo "$SUMMARY_LINE" | sed -E 's/.*Summary: ([0-9]+) tests.*/\1/')
          ERRORS=$(echo "$SUMMARY_LINE" | sed -E 's/.* ([0-9]+) errors.*/\1/')
          FAILURES=$(echo "$SUMMARY_LINE" | sed -E 's/.* ([0-9]+) failures.*/\1/')
          SKIPPED=$(echo "$SUMMARY_LINE" | sed -E 's/.* ([0-9]+) skipped.*/\1/')
          SUCCESSFUL_TESTS=$((TOTAL_TESTS - ERRORS - FAILURES - SKIPPED))

          # Compute percentage success
          if [ "$TOTAL_TESTS" -gt 0 ]; then
            PERCENTAGE_SUCCESS=$((SUCCESSFUL_TESTS * 100 / TOTAL_TESTS))
          else
            PERCENTAGE_SUCCESS=0
          fi

          echo "Total tests: $TOTAL_TESTS, Successful: $SUCCESSFUL_TESTS, Percentage: $PERCENTAGE_SUCCESS%"

          # Determine badge color
          if [ "$PERCENTAGE_SUCCESS" -eq 100 ]; then
            COLOR="green"
          elif [ "$PERCENTAGE_SUCCESS" -lt 50 ]; then
            COLOR="red"
          else
            COLOR="yellow"
          fi

          # Download badge image
          curl -o ros_ws/build/avt_341/unit_test_badge.svg "https://img.shields.io/badge/Unit_Tests-${PERCENTAGE_SUCCESS}%25_%28${SUCCESSFUL_TESTS}/${TOTAL_TESTS}%29-${COLOR}"

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        if: always() && env.BUILD_DONE == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Upload Test results
        if: always() && env.BUILD_DONE == 'true'
        run: |
          aws s3 cp ros_ws/build/avt_341/test_results s3://${{ secrets.AWS_S3_BUCKET_NAME }}/test_results --recursive
          aws s3 cp ros_ws/build/avt_341/unit_test_badge.svg s3://${{ secrets.AWS_S3_BUCKET_NAME }}/unit_test_badge.svg --acl public-read
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/test_results/*"
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/unit_test_badge.svg"
          urls=$(curl -sLk "https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/tree/${{ steps.branch-name.outputs.current_branch }}" | grep -Eo "(http|https)://camo.githubusercontent.com[a-zA-Z0-9./?=_%:-]*")
          while IFS= read -r url; do curl -X PURGE "$url"; done <<< "$urls"
