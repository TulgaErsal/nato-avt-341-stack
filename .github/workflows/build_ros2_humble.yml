# Workflow to run the ROS2 Humble build every night if source code changed within the day
name: Build ROS2 Humble Linux

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:

  # Based on https://github.com/orgs/community/discussions/27128
  check_date:
    runs-on: ubuntu-22.04
    name: Check for Recent Commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Repository Last Commit
        run: echo ${{ github.sha }}

      - id: should_run
        name: Set if Last Commit Within 24 Hours
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' }}
        run: |
          test -z $(git rev-list --after="24 hours" ${{ github.sha }}) && echo "::set-output name=should_run::false"

  build:
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    name: Build AVT341 Stack
    runs-on: ubuntu-22.04
    steps:

      - name: Install ROS2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: ros_ws/src

      - name: Install ROS Dependencies
        run: |
          sudo apt install -y ros-humble-pcl-ros ros-humble-ackermann-msgs ros-humble-vision-msgs libqt5svg5-dev unzip
          sudo apt install -y python3-jinja2 python3-typeguard python3-yaml
          wget https://download.pytorch.org/libtorch/nightly/cpu/libtorch-shared-with-deps-latest.zip
          unzip libtorch-shared-with-deps-latest.zip

      # Note: Environment variables do not seem to persist through job steps, need to call source here
      - name: Build repository
        run: |
          export Torch_DIR="$(pwd)/libtorch"
          source /opt/ros/humble/setup.bash
          cd ros_ws
          # Since no workspace installation exists beforehand, build avt_341_param_lib before so modules can be added to python path. 
          colcon build --packages-select avt_341_param_lib
          source install/setup.bash
          colcon build --packages-up-to avt_341
          echo "BUILD_DONE=true" >> $GITHUB_ENV
          colcon test --packages-select avt_341_nav --ctest-args --output-junit test_results/test_results.xml
          colcon test-result --all --verbose | tee test_result_output.txt

      - name: Generate Test Report and Badge
        if: always() && env.BUILD_DONE == 'true'
        run: |
          pip install junit2html

          # Convert JUnit XML to HTML report
          python -m junit2htmlreport ros_ws/build/avt_341_nav/test_results/test_results.xml ros_ws/build/avt_341_nav/test_results/test_results.html

          # Extract total and successful test counts from colcon test-result summary line
          # Format: "Summary: 38 tests, 0 errors, 0 failures, 0 skipped"
          SUMMARY_LINE=$(grep -E "^Summary:" ros_ws/test_result_output.txt)
          TOTAL_TESTS=$(echo "$SUMMARY_LINE" | sed -E 's/.*Summary: ([0-9]+) tests.*/\1/')
          ERRORS=$(echo "$SUMMARY_LINE" | sed -E 's/.* ([0-9]+) errors.*/\1/')
          FAILURES=$(echo "$SUMMARY_LINE" | sed -E 's/.* ([0-9]+) failures.*/\1/')
          SKIPPED=$(echo "$SUMMARY_LINE" | sed -E 's/.* ([0-9]+) skipped.*/\1/')
          SUCCESSFUL_TESTS=$((TOTAL_TESTS - ERRORS - FAILURES - SKIPPED))

          # Compute percentage success
          if [ "$TOTAL_TESTS" -gt 0 ]; then
            PERCENTAGE_SUCCESS=$((SUCCESSFUL_TESTS * 100 / TOTAL_TESTS))
          else
            PERCENTAGE_SUCCESS=0
          fi

          echo "Total tests: $TOTAL_TESTS, Successful: $SUCCESSFUL_TESTS, Percentage: $PERCENTAGE_SUCCESS%"

          # Determine badge color
          if [ "$PERCENTAGE_SUCCESS" -eq 100 ]; then
            COLOR="green"
          elif [ "$PERCENTAGE_SUCCESS" -lt 50 ]; then
            COLOR="red"
          else
            COLOR="yellow"
          fi

          # Download badge image
          curl -o ros_ws/build/avt_341_nav/unit_test_badge.svg "https://img.shields.io/badge/Unit_Tests-${PERCENTAGE_SUCCESS}%25_%28${SUCCESSFUL_TESTS}/${TOTAL_TESTS}%29-${COLOR}"

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        if: always() && env.BUILD_DONE == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Upload Test results
        if: always() && env.BUILD_DONE == 'true'
        run: |
          aws s3 cp ros_ws/build/avt_341_nav/test_results s3://${{ secrets.AWS_S3_BUCKET_NAME }}/test_results --recursive
          # Explicit cache headers since Github camo user content defaults to excessively long TTL cache without this
          aws s3 cp ros_ws/build/avt_341_nav/unit_test_badge.svg s3://${{ secrets.AWS_S3_BUCKET_NAME }}/unit_test_badge.svg \
            --acl public-read \
            --content-type "image/svg+xml" \
            --cache-control "no-cache, max-age=0, must-revalidate"
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/test_results/*"
          # Capture the invalidation id so the camo purge below can wait for it to complete
          BADGE_INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/unit_test_badge.svg" \
            --query 'Invalidation.Id' --output text)
          echo "BADGE_INVALIDATION_ID=$BADGE_INVALIDATION_ID" >> $GITHUB_ENV

      # GitHub proxies README images through camo, which is pull-based: the upload above is
      # invisible to it until its own cached entry expires. PURGE forces a re-fetch. The
      # endpoint is undocumented and unsupported by GitHub, so this step is best-effort and
      # must never fail the build.
      - name: Purge GitHub camo cache for badge
        if: always() && env.BUILD_DONE == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Wait for the invalidation to finish first. Purging early would make camo re-fetch
          # a stale edge copy and re-pin it under a fresh long TTL - the exact failure mode
          # the cache headers above exist to prevent.
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "$BADGE_INVALIDATION_ID"

          # Rendered README emits <img src="https://camo.../HASH" data-canonical-src="<origin url>">.
          # Split on '>' so each tag is one line, then isolate the tag for this badge.
          CAMO_URL=$(curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.html" \
            "https://api.github.com/repos/${{ github.repository }}/readme" \
            | tr '>' '\n' \
            | grep 'unit_test_badge\.svg' \
            | grep -o 'https://camo\.githubusercontent\.com[^"]*' \
            | head -1)

          if [ -z "$CAMO_URL" ]; then
            echo "::warning::No camo URL found for unit_test_badge.svg. Either the README no longer references it, the token lacks contents:read, or GitHub stopped emitting data-canonical-src."
            exit 0
          fi

          echo "Purging $CAMO_URL"
          curl -s -o /dev/null -w 'PURGE responded %{http_code}\n' -X PURGE "$CAMO_URL"
