# Workflow to run the ROS1 Noetic build every night if source code changed within the day
name: Build ROS1 Noetic Linux

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:

  # Based on https://github.com/orgs/community/discussions/27128
  check_date:
    runs-on: ubuntu-latest
    name: Check for Recent Commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Repository Last Commit
        run: echo ${{ github.sha }}

      - id: should_run
        name: Set if Last Commit Within 24 Hours
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' }}
        run: |
          test -z $(git rev-list --after="24 hours" ${{ github.sha }}) && echo "::set-output name=should_run::false"

  build:
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    name: Build AVT341 Stack
    runs-on: ubuntu-latest
    container:
      image: ubuntu:focal
    steps:

      - name: Install ROS1 Noetic
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: noetic

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: ros_ws/src

      - name: Install ROS Dependencies
        shell: bash
        run: |
          sudo apt install -y ros-noetic-pcl-ros ros-noetic-jsk-recognition-msgs ros-noetic-jsk-rviz-plugins ros-noetic-tf2-sensor-msgs ros-noetic-ackermann-msgs

      # Note: Environment variables do not seem to persist through job steps, need to call source here
      - name: Build repository
        shell: bash
        run: |
          source /opt/ros/noetic/setup.bash
          cd ros_ws
          catkin_make --only-pkg-with-deps avt_341_msgs
          source devel/setup.bash
          catkin_make --only-pkg-with-deps avt_341 --cmake-args -DAVT341_DISABLE_MPC=ON

