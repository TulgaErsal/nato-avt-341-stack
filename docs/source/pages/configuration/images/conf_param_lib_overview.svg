<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 636" width="1040" height="636" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Parameter library data flow</title>
  <desc id="dsc">Step 1, at build time: template parameter yaml files are turned by the code generator into generated parameter code, which is compiled and linked together with the node source code into a node executable that carries the template defaults. Step 2, at launch time: runtime parameter yaml files and command line arguments are merged by the runtime override module and applied to the running node. Inside the running node, param1 and param2 have their template defaults replaced by the override values, while param3 is not named by any override and keeps its template default.</desc>

  <style>
    .s     { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m     { font-family: ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", Menlo, monospace; }
    .head  { font-size: 13px; font-weight: 700; letter-spacing: .8px; }
    .heads { font-size: 12px; fill: #94a3b8; }
    .lbl   { font-size: 13px; font-weight: 600; fill: #0f172a; }
    .sub   { font-size: 11.5px; fill: #94a3b8; }
    .cap   { font-size: 10.5px; fill: #94a3b8; letter-spacing: .3px; }
    .val   { font-size: 12.5px; }
    .num   { font-size: 13px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
    <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <g transform="translate(-20,-60)">
  <!-- ================= BAND 1 : build time ================= -->
  <rect x="24" y="64" width="1032" height="300" rx="14" fill="#eff4ff" stroke="#dbe6fb"/>
  <circle cx="61" cy="96" r="13" fill="#2563eb"/>
  <text class="s num" x="61" y="100.5" text-anchor="middle">1</text>
  <text class="s head" x="86" y="101" fill="#1d4ed8">CODE GENERATION</text>
  <text class="s heads" x="228" y="101">at build time</text>

  <!-- template yaml stack : centered (140,180) -->
  <g>
    <path d="M121 154 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#dbe6fb" stroke="#bfd3f5"/>
    <path d="M117 158 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#e8effc" stroke="#bfd3f5"/>
    <path d="M113 160 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#ffffff" stroke="#2563eb"/>
    <path d="M141 154 v12 a6 6 0 0 0 6 6 h12 z" fill="#dbeafe"/>
    <rect x="122" y="182" width="26" height="3" rx="1.5" fill="#93c5fd"/>
    <rect x="122" y="190" width="22" height="3" rx="1.5" fill="#bfdbfe"/>
    <rect x="122" y="198" width="18" height="3" rx="1.5" fill="#bfdbfe"/>
  </g>
  <text class="s lbl" x="140" y="234" text-anchor="middle">Template parameter files</text>
  <text class="s sub" x="140" y="251" text-anchor="middle">the defaults you write</text>

  <line x1="180" y1="180" x2="270" y2="180" stroke="#2563eb" stroke-width="1.8" marker-end="url(#aB)"/>

  <!-- gear : code generator, centered (320,180) -->
  <g transform="translate(320,180)">
    <g fill="#2563eb">
      <rect x="-6" y="-40" width="12" height="13" rx="3"/>
      <rect x="-6" y="-40" width="12" height="13" rx="3" transform="rotate(45)"/>
      <rect x="-6" y="-40" width="12" height="13" rx="3" transform="rotate(90)"/>
      <rect x="-6" y="-40" width="12" height="13" rx="3" transform="rotate(135)"/>
      <rect x="-6" y="-40" width="12" height="13" rx="3" transform="rotate(180)"/>
      <rect x="-6" y="-40" width="12" height="13" rx="3" transform="rotate(225)"/>
      <rect x="-6" y="-40" width="12" height="13" rx="3" transform="rotate(270)"/>
      <rect x="-6" y="-40" width="12" height="13" rx="3" transform="rotate(315)"/>
    </g>
    <circle cx="0" cy="0" r="30" fill="#2563eb"/>
    <circle cx="0" cy="0" r="11" fill="#eff4ff"/>
  </g>
  <text class="s lbl" x="320" y="234" text-anchor="middle">Code generator</text>
  <text class="s sub" x="320" y="251" text-anchor="middle">reads every template</text>

  <line x1="370" y1="180" x2="473" y2="180" stroke="#2563eb" stroke-width="1.8" marker-end="url(#aB)"/>

  <!-- generated code stack : centered (510,180) -->
  <g>
    <path d="M491 154 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#bfd3f5" stroke="#93b4ee"/>
    <path d="M487 158 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#cfdefa" stroke="#93b4ee"/>
    <path d="M483 160 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#dbeafe" stroke="#2563eb"/>
    <path d="M511 154 v12 a6 6 0 0 0 6 6 h12 z" fill="#bfdbfe"/>
    <rect x="492" y="182" width="26" height="3" rx="1.5" fill="#2563eb"/>
    <rect x="492" y="190" width="22" height="3" rx="1.5" fill="#60a5fa"/>
    <rect x="492" y="198" width="18" height="3" rx="1.5" fill="#60a5fa"/>
  </g>
  <text class="s lbl" x="510" y="234" text-anchor="middle">Generated parameter code</text>
  <text class="s sub" x="510" y="251" text-anchor="middle">declares and reads them for you</text>

  <!-- your source code stack : centered (510,300) -->
  <g>
    <path d="M491 274 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#e2e8f0" stroke="#cbd5e1"/>
    <path d="M487 278 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#eef2f6" stroke="#cbd5e1"/>
    <path d="M483 280 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#ffffff" stroke="#94a3b8"/>
    <path d="M511 274 v12 a6 6 0 0 0 6 6 h12 z" fill="#e2e8f0"/>
    <rect x="492" y="302" width="26" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="492" y="310" width="22" height="3" rx="1.5" fill="#e2e8f0"/>
    <rect x="492" y="318" width="18" height="3" rx="1.5" fill="#e2e8f0"/>
  </g>
  <text class="s lbl" x="510" y="352" text-anchor="middle">Your node source code</text>

  <!-- converge into build -->
  <path d="M548 182 C 585 186, 610 192, 649 200" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#aB)"/>
  <path d="M548 296 C 585 292, 610 246, 649 232" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#aS)"/>

  <!-- build box -->
  <rect x="655" y="168" width="120" height="96" rx="12" fill="#ffffff" stroke="#dbeafe"/>
  <path d="M715 180 l22 12 v24 l-22 12 -22 -12 v-24 z" fill="#dbeafe" stroke="#2563eb" stroke-linejoin="round"/>
  <path d="M693 192 l22 12 22 -12 M715 204 v24" fill="none" stroke="#2563eb" stroke-width="1.2" opacity=".7"/>
  <text class="s lbl" x="715" y="244" text-anchor="middle">Compile + link</text>

  <line x1="781" y1="216" x2="869" y2="216" stroke="#2563eb" stroke-width="1.8" marker-end="url(#aB)"/>

  <!-- executable chip : centered (925,216) -->
  <g>
    <g fill="#93b4ee">
      <rect x="879" y="192" width="8" height="8" rx="2"/><rect x="879" y="212" width="8" height="8" rx="2"/><rect x="879" y="232" width="8" height="8" rx="2"/>
      <rect x="963" y="192" width="8" height="8" rx="2"/><rect x="963" y="212" width="8" height="8" rx="2"/><rect x="963" y="232" width="8" height="8" rx="2"/>
      <rect x="901" y="170" width="8" height="8" rx="2"/><rect x="921" y="170" width="8" height="8" rx="2"/><rect x="941" y="170" width="8" height="8" rx="2"/>
      <rect x="901" y="254" width="8" height="8" rx="2"/><rect x="921" y="254" width="8" height="8" rx="2"/><rect x="941" y="254" width="8" height="8" rx="2"/>
    </g>
    <rect x="887" y="178" width="76" height="76" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="907" y="198" width="36" height="36" rx="9" fill="#2563eb"/>
  </g>
  <text class="s lbl" x="925" y="282" text-anchor="middle">Node executable</text>
  <text class="s sub" x="925" y="299" text-anchor="middle">template defaults built in</text>

  <!-- handoff to runtime -->
  <line x1="925" y1="315" x2="925" y2="478" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#aS)"/>

  <!-- ================= BAND 2 : launch time ================= -->
  <rect x="24" y="392" width="1032" height="300" rx="14" fill="#fffaf0" stroke="#fde9c8"/>
  <circle cx="61" cy="424" r="13" fill="#d97706"/>
  <text class="s num" x="61" y="428.5" text-anchor="middle">2</text>
  <text class="s head" x="86" y="429" fill="#b45309">RUNTIME</text>
  <text class="s heads" x="160" y="429">at launch time</text>

  <!-- runtime yaml stack : centered (140,492) -->
  <g>
    <path d="M121 466 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#fde9c8" stroke="#f7d79b"/>
    <path d="M117 470 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#fdf2dd" stroke="#f7d79b"/>
    <path d="M113 472 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#ffffff" stroke="#d97706"/>
    <path d="M141 466 v12 a6 6 0 0 0 6 6 h12 z" fill="#fde9c8"/>
    <rect x="122" y="494" width="26" height="3" rx="1.5" fill="#f59e0b"/>
    <rect x="122" y="502" width="22" height="3" rx="1.5" fill="#fcd34d"/>
    <rect x="122" y="510" width="18" height="3" rx="1.5" fill="#fcd34d"/>
  </g>
  <text class="s lbl" x="140" y="546" text-anchor="middle">Runtime parameter files</text>

  <!-- command line : centered (140,614) -->
  <g>
    <rect x="94" y="582" width="92" height="64" rx="10" fill="#ffffff" stroke="#d97706"/>
    <path d="M94 592 a10 10 0 0 1 10 -10 h72 a10 10 0 0 1 10 10 v4 h-92 z" fill="#fde9c8"/>
    <g fill="#f59e0b"><circle cx="106" cy="588" r="2.5"/><circle cx="115" cy="588" r="2.5"/><circle cx="124" cy="588" r="2.5"/></g>
    <path d="M108 610 l10 8 -10 8" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="126" y="624" width="30" height="3.5" rx="1.75" fill="#fcd34d"/>
  </g>
  <text class="s lbl" x="140" y="668" text-anchor="middle">Command line arguments</text>

  <path d="M186 500 C 210 508, 222 514, 242 522" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#aA)"/>
  <path d="M196 606 C 216 600, 224 596, 242 590" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#aA)"/>

  <!-- funnel : runtime override module -->
  <path d="M250 501 L322 542 L366 542 L366 568 L322 568 L250 609 Z" fill="#fef3e2" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="s lbl" x="308" y="634" text-anchor="middle">Runtime override module</text>
  <text class="s sub" x="308" y="651" text-anchor="middle">merges them, per node</text>

  <line x1="374" y1="555" x2="594" y2="555" stroke="#d97706" stroke-width="1.8" marker-end="url(#aA)"/>
  <text class="s sub" x="484" y="545" text-anchor="middle" fill="#b45309">parameter overrides</text>

  <!-- running node -->
  <rect x="600" y="486" width="432" height="172" rx="12" fill="#ffffff" stroke="#fde9c8"/>
  <text class="s lbl" x="624" y="512">Running node</text>
  <text class="s sub" x="624" y="530">the executable from step 1</text>
  <text class="s cap" x="800" y="558">DEFAULT</text>
  <text class="s cap" x="936" y="558">EFFECTIVE</text>
  <line x1="624" y1="566" x2="1008" y2="566" stroke="#f1f5f9"/>
  <!-- overridden by a runtime source -->
  <text class="m val" x="624" y="586" fill="#475569">param1</text>
  <text class="m val" x="800" y="586" fill="#cbd5e1">1.0</text>
  <line x1="798" y1="582" x2="822" y2="582" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="s val" x="890" y="586" fill="#94a3b8">&#8594;</text>
  <text class="m val" x="936" y="586" fill="#b45309" font-weight="700">3.3</text>
  <text class="m val" x="624" y="612" fill="#475569">param2</text>
  <text class="m val" x="800" y="612" fill="#cbd5e1">grid</text>
  <line x1="798" y1="608" x2="829" y2="608" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="s val" x="890" y="612" fill="#94a3b8">&#8594;</text>
  <text class="m val" x="936" y="612" fill="#b45309" font-weight="700">graph</text>
  <!-- named by no override : the template default is kept -->
  <text class="m val" x="624" y="638" fill="#475569">param3</text>
  <text class="m val" x="800" y="638" fill="#475569">0.8</text>
  <text class="s val" x="890" y="638" fill="#94a3b8">&#8594;</text>
  <text class="m val" x="936" y="638" fill="#1d4ed8" font-weight="700">0.8</text>
  </g>
</svg>
