<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 418" width="836" height="418" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Parameter override priority</title>
  <desc id="dsc">Three sources of parameter values, lowest priority at the top and highest at the bottom: template parameter files from code generation, then runtime parameter files, then command line arguments. Overriding happens per parameter. For three example parameters: param1 is set by all three sources, so the command line value wins; param2 is set by the template and the runtime files but not on the command line, so the runtime value wins; param3 is set only by the template, so its default is retained. A parameter not specified by a higher priority source keeps the value from the highest priority source that does specify it.</desc>

  <style>
    .s    { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m    { font-family: ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", Menlo, monospace; }
    .rowt { font-size: 13.5px; font-weight: 600; fill: #0f172a; }
    .sub  { font-size: 11px; fill: #64748b; }
    .badge{ font-size: 11.5px; font-weight: 600; }
    .axis { font-size: 12px; font-weight: 700; letter-spacing: 3px; fill: #ffffff; }
    .num  { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
    .phdr { font-size: 10px; fill: #64748b; }
    .cell { font-size: 11px; }
    .eff  { font-size: 11px; font-weight: 700; }
  </style>

  <defs>
    <marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- example parameter column headers -->
  <text class="m phdr" x="598" y="20" text-anchor="middle">param1</text>
  <text class="m phdr" x="686" y="20" text-anchor="middle">param2</text>
  <text class="m phdr" x="774" y="20" text-anchor="middle">param3</text>

  <!-- priority axis : points down, toward the highest priority -->
  <path d="M32 40 L56 40 L56 300 L68 300 L44 344 L20 300 L32 300 Z" fill="#475569"/>
  <text class="s axis" x="40" y="170" text-anchor="middle" transform="rotate(90,40,170)">PRIORITY</text>

  <!-- ============ lowest : template parameter files ============ -->
  <rect x="88" y="36" width="744" height="92" rx="12" fill="#eff4ff" stroke="#dbe6fb"/>
  <g transform="translate(145,82) scale(0.85) translate(-140,-180)">
    <path d="M121 154 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#dbe6fb" stroke="#bfd3f5"/>
    <path d="M117 158 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#e8effc" stroke="#bfd3f5"/>
    <path d="M113 160 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#ffffff" stroke="#2563eb"/>
    <path d="M141 154 v12 a6 6 0 0 0 6 6 h12 z" fill="#dbeafe"/>
    <rect x="122" y="182" width="26" height="3" rx="1.5" fill="#93c5fd"/>
    <rect x="122" y="190" width="22" height="3" rx="1.5" fill="#bfdbfe"/>
    <rect x="122" y="198" width="18" height="3" rx="1.5" fill="#bfdbfe"/>
  </g>
  <text class="s rowt" x="202" y="78">Template parameter files</text>
  <text class="s sub"  x="202" y="97">the defaults built into the node</text>
  <rect x="380" y="64" width="152" height="36" rx="18" fill="#ffffff" stroke="#dbe6fb"/>
  <circle cx="402" cy="82" r="11" fill="#2563eb"/>
  <text class="s num" x="402" y="86" text-anchor="middle">1</text>
  <text class="s badge" x="424" y="86" fill="#1d4ed8">Code generation</text>
  <!-- cells : sets all three, keeps only param3 -->
  <rect x="560" y="65" width="76" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="m cell" x="598" y="86" text-anchor="middle" fill="#cbd5e1">1.0</text>
  <line x1="586" y1="82" x2="610" y2="82" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="648" y="65" width="76" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="m cell" x="686" y="86" text-anchor="middle" fill="#cbd5e1">grid</text>
  <line x1="671" y1="82" x2="701" y2="82" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="736" y="65" width="76" height="34" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="m eff" x="774" y="86" text-anchor="middle" fill="#1d4ed8">0.8</text>

  <!-- ============ middle : runtime parameter files ============ -->
  <rect x="88" y="146" width="744" height="92" rx="12" fill="#fffaf0" stroke="#fde9c8"/>
  <g transform="translate(145,192) scale(0.85) translate(-140,-492)">
    <path d="M121 466 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#fde9c8" stroke="#f7d79b"/>
    <path d="M117 470 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#fdf2dd" stroke="#f7d79b"/>
    <path d="M113 472 a6 6 0 0 1 6 -6 h22 l18 18 v36 a6 6 0 0 1 -6 6 h-34 a6 6 0 0 1 -6 -6 z" fill="#ffffff" stroke="#d97706"/>
    <path d="M141 466 v12 a6 6 0 0 0 6 6 h12 z" fill="#fde9c8"/>
    <rect x="122" y="494" width="26" height="3" rx="1.5" fill="#f59e0b"/>
    <rect x="122" y="502" width="22" height="3" rx="1.5" fill="#fcd34d"/>
    <rect x="122" y="510" width="18" height="3" rx="1.5" fill="#fcd34d"/>
  </g>
  <text class="s rowt" x="202" y="188">Runtime parameter files</text>
  <text class="s sub"  x="202" y="207">override the template defaults</text>
  <rect x="380" y="174" width="110" height="36" rx="18" fill="#ffffff" stroke="#fde9c8"/>
  <circle cx="402" cy="192" r="11" fill="#d97706"/>
  <text class="s num" x="402" y="196" text-anchor="middle">2</text>
  <text class="s badge" x="424" y="196" fill="#b45309">Runtime</text>
  <!-- cells : sets param1 and param2, says nothing about param3 -->
  <rect x="560" y="175" width="76" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="m cell" x="598" y="196" text-anchor="middle" fill="#cbd5e1">2.5</text>
  <line x1="586" y1="192" x2="610" y2="192" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="648" y="175" width="76" height="34" rx="8" fill="#fde9c8" stroke="#d97706"/>
  <text class="m eff" x="686" y="196" text-anchor="middle" fill="#b45309">graph</text>
  <rect x="736" y="175" width="76" height="34" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="3 3"/>

  <!-- ============ highest : command line arguments ============ -->
  <rect x="88" y="256" width="744" height="92" rx="12" fill="#fffaf0" stroke="#fde9c8"/>
  <g transform="translate(145,302) scale(0.75) translate(-140,-614)">
    <rect x="94" y="582" width="92" height="64" rx="10" fill="#ffffff" stroke="#d97706"/>
    <path d="M94 592 a10 10 0 0 1 10 -10 h72 a10 10 0 0 1 10 10 v4 h-92 z" fill="#fde9c8"/>
    <g fill="#f59e0b"><circle cx="106" cy="588" r="2.5"/><circle cx="115" cy="588" r="2.5"/><circle cx="124" cy="588" r="2.5"/></g>
    <path d="M108 610 l10 8 -10 8" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="126" y="624" width="30" height="3.5" rx="1.75" fill="#fcd34d"/>
  </g>
  <text class="s rowt" x="202" y="298">Command line arguments</text>
  <text class="s sub"  x="202" y="317">override everything above</text>
  <rect x="380" y="284" width="110" height="36" rx="18" fill="#ffffff" stroke="#fde9c8"/>
  <circle cx="402" cy="302" r="11" fill="#d97706"/>
  <text class="s num" x="402" y="306" text-anchor="middle">2</text>
  <text class="s badge" x="424" y="306" fill="#b45309">Runtime</text>
  <!-- cells : sets param1 only -->
  <rect x="560" y="285" width="76" height="34" rx="8" fill="#fde9c8" stroke="#d97706"/>
  <text class="m eff" x="598" y="306" text-anchor="middle" fill="#b45309">3.3</text>
  <rect x="648" y="285" width="76" height="34" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <rect x="736" y="285" width="76" height="34" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="3 3"/>

  <!-- values falling through the layers that do not set them -->
  <line x1="774" y1="99"  x2="774" y2="369" stroke="#2563eb" stroke-width="1.5" marker-end="url(#fb)"/>
  <line x1="686" y1="209" x2="686" y2="369" stroke="#d97706" stroke-width="1.5" marker-end="url(#fa)"/>
  <line x1="598" y1="319" x2="598" y2="369" stroke="#d97706" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- ============ result ============ -->
  <rect x="88" y="366" width="744" height="48" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="s rowt" x="202" y="395">Effective value</text>
  <text class="s sub"  x="322" y="395">one merge per parameter</text>
  <rect x="560" y="373" width="76" height="34" rx="8" fill="#fffaf0" stroke="#d97706"/>
  <text class="m eff" x="598" y="394" text-anchor="middle" fill="#b45309">3.3</text>
  <rect x="648" y="373" width="76" height="34" rx="8" fill="#fffaf0" stroke="#d97706"/>
  <text class="m eff" x="686" y="394" text-anchor="middle" fill="#b45309">graph</text>
  <rect x="736" y="373" width="76" height="34" rx="8" fill="#eff4ff" stroke="#2563eb"/>
  <text class="m eff" x="774" y="394" text-anchor="middle" fill="#1d4ed8">0.8</text>
</svg>
