<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Objective marker: the MapMarker clicked to define the formation target -->
  <circle cx="32" cy="13" r="8" fill="#00cc00" fill-opacity="0.15"
          stroke="#00aaff" stroke-width="2.5"/>
  <circle cx="32" cy="13" r="2.5" fill="#00aaff"/>
  <!-- Links holding the formation together -->
  <g stroke="#8a8a8a" stroke-width="1.5">
    <line x1="32" y1="30" x2="18" y2="42"/>
    <line x1="32" y1="30" x2="46" y2="42"/>
  </g>
  <!-- Vehicles in a wedge heading toward the objective (leader green, wingmen orange) -->
  <g stroke-width="1.5" stroke-linejoin="round">
    <polygon points="32,23 38,35 26,35" fill="#19b300" stroke="#0d6b00"/>
    <polygon points="18,35 24,47 12,47" fill="#ff8c00" stroke="#b35900"/>
    <polygon points="46,35 52,47 40,47" fill="#ff8c00" stroke="#b35900"/>
  </g>
</svg>
