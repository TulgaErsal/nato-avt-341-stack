<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- A task status panel floating above a vehicle: a rounded label box with
       text stubs and a pointer down to the vehicle marker -->
  <rect x="6" y="6" width="52" height="30" rx="4" fill="#2e3192" stroke="#1b1d5a" stroke-width="2"/>
  <polygon points="27,36 37,36 32,44" fill="#2e3192" stroke="#1b1d5a" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#ffffff">
    <rect x="12" y="13" width="34" height="4"/>
    <rect x="12" y="22" width="22" height="4"/>
  </g>
  <circle cx="32" cy="52" r="6" fill="#ffcc00" stroke="#8a6d00" stroke-width="2"/>
</svg>
