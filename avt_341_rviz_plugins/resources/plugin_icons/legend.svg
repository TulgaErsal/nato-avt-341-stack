<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- A legend box: two path lines, a traversability gradient and an obstacle
       cell, each beside a label stub -->
  <defs>
    <linearGradient id="ramp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00a651"/>
      <stop offset="0.5" stop-color="#ffcc00"/>
      <stop offset="1" stop-color="#ef4136"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="48" height="48" rx="3" fill="#eaf6ff" stroke="#005c99" stroke-width="2" stroke-linejoin="round"/>
  <rect x="14" y="13" width="9" height="4" fill="#2e3192"/>
  <rect x="14" y="21" width="9" height="4" fill="#ed1c24"/>
  <rect x="14" y="29" width="9" height="12" fill="url(#ramp)"/>
  <rect x="14.5" y="44" width="8" height="8" fill="#000000"/>
  <g fill="#005c99">
    <rect x="27" y="14" width="22" height="2"/>
    <rect x="27" y="22" width="18" height="2"/>
    <rect x="27" y="30" width="22" height="2"/>
    <rect x="27" y="38" width="20" height="2"/>
    <rect x="27" y="47" width="16" height="2"/>
  </g>
</svg>
