# Color schemes for the avt_341_rviz_plugins/AugmentedMap display.
#
# The display renders nav_msgs/OccupancyGrid exactly like the built-in
# rviz_default_plugins/Map display and always offers the built-in schemes
# (map, costmap, raw); every scheme defined here is appended to the display's
# "Color Scheme" dropdown. This file is the package default - a different file
# can be selected per display via its "Color Scheme File" property.
#
# Cell values are the signed OccupancyGrid data bytes: 0..100 are the legal
# occupancy/cost/class values, -1 is "unknown"; anything else (101..127 and
# -128..-2) is out of contract.
#
# Format
# ------
# schemes:            (required) list of scheme definitions
#   - name:           (required) dropdown label; unique, not map/costmap/raw
#     default:        color for any cell value not covered by values
#                     (default: fully transparent)
#     values:         map of cell value or range -> color or gradient
#
# values keys:   a single cell value V, or an inclusive range LO..HI
#                (integers in -128..127, LO <= HI). Later entries override
#                earlier ones where they overlap.
# colors:        [r, g, b] (opaque), [r, g, b, a], "#RRGGBB" or "#RRGGBBAA",
#                channels 0-255. Hex strings must be quoted (an unquoted #
#                starts a YAML comment).
# gradients:     "#RRGGBB..#RRGGBB" (two or more hex stops joined with ..) or
#                a list of colors [color, color, ...]. Stops are spread evenly
#                across the key range with linear per-channel RGBA
#                interpolation; only valid on a range key with LO < HI.
#
# A scheme needs at least one of values / default. Invalid schemes are skipped
# with a warning on the display's status; schemes with any alpha < 255 are
# alpha-blended even at display Alpha = 1.

schemes:
  # Soft-cost ramp: free space invisible, rising cost green -> yellow -> red,
  # lethal cells (100) pinned magenta so they stand out from high soft cost.
  # The last two entries reproduce the built-in Map display's debug colors so
  # misbehaving publishers stay visible.
  - name: soft_cost
    values:
      -1:        [128, 128, 128, 64]
      0:         [0, 160, 0, 0]
      1..60:     [[0, 160, 0, 120], [255, 255, 0, 200]]
      60..99:    "#FFFF00C8..#FF0000"
      100:       "#FF00FF"
      101..127:  "#00FF00"
      -128..-2:  "#FF0000..#FFFF00"

  # Terrain segmentation classes: exact per-class colors. Example ids - adjust
  # to the deployed segmentation classes; unknown cells are hidden and any
  # other value (unmapped class ids and out-of-contract values) shows magenta.
  - name: segmentation
    default: [255, 0, 255]
    values:
      -1: [0, 0, 0, 0]
      0:  [120, 120, 120]
      1:  [34, 139, 34]
      2:  [139, 90, 43]

  # Minimal example: one gradient over the whole legal range; everything else
  # (unknown and out-of-contract values) stays transparent.
  - name: grayscale
    values:
      0..100: "#000000..#FFFFFF"
