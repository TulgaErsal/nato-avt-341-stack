code_namespace: avt_341_nav/params/mpc_local_planner
ros__parameters:

  # Costmap transport (publish.method drives latching of grid subscriptions)
  costmap:
    __include_mixins: costmap_publish_mixin

  # Julia module paths (avt_341_mpc_planner_node)
  # ====================================================================================================================
  sysimage_path:
    type: string
    default_value: ""
    description: "Filepath to the Julia sysimage"
  planner_module_path:
    type: string
    default_value: ""
    description: "Filepath to the Julia MPC planner module"
  parameters_module_path:
    type: string
    default_value: ""
    description: "Filepath to the Julia MPC parameters module"
  models_module_path:
    type: string
    default_value: ""
    description: "Filepath to the Julia MPC models module"

  # MPC planner
  # ====================================================================================================================
  rate:
    type: double
    default_value: 20.0
    description: "Planner update rate"
    validation:
      gt<>: [ 0.0 ]
  compute_time_publish_period:
    type: double
    default_value: 1.0
    description: "Period in seconds for publishing planner compute-time summaries; <= 0 disables."
  tire_model:
    type: string
    default_value: "P"
    description: "L for linear, P for Pacejka, N for neural network for deformable terrain"
    validation:
      one_of<>: [ [ "L", "P", "N" ] ]
  num_col_points:
    type: int
    default_value: 10
    description: "number of collocation points to use in MPC"
    validation:
      gt<>: [ 0 ]
  prediction_time_horizon:
    type: double
    default_value: 2.0
    description: "MPC prediction time horizon [s]"
  max_num_obs:
    type: int
    default_value: 20000
    description: "maximum number of obstacles the MPC takes; extra ones are dropped, farthest from the vehicle first when obs_per_col_point > 0, otherwise in the order received. With obs_per_col_point > 0 this is only a safety ceiling; with obs_per_col_point = 0 it sizes the NLP and its cost grows with it, so use ~500 there"
    validation:
      gt<>: [ 0 ]
  obs_per_col_point:
    type: int
    default_value: 30
    description: "if > 0, each collocation point only sees its this many nearest obstacles (re-selected every solve), so the MPC cost no longer grows with max_num_obs; 0 = every collocation point sees all max_num_obs slots (legacy formulation)"
    validation:
      gt_eq<>: [ 0 ]
  solve_cpu_time_budget:
    type: double
    default_value: 0.1
    description: "CPU time [s] the Ipopt solves of one planning step may use together; each solve gets what is left, and obstacle re-selection and fallback re-solves are skipped when less than min_resolve_cpu_time is left; a re-selection re-solve that does not finish keeps the previous optimal solution"
    validation:
      gt<>: [ 0.0 ]
  min_resolve_cpu_time:
    type: double
    default_value: 0.02
    description: "CPU time [s] that must be left of solve_cpu_time_budget to start an obstacle re-selection or fallback re-solve"
    validation:
      gt<>: [ 0.0 ]
  max_num_seg:
    type: int
    default_value: 2000
    description: "maximum number of segmentation cells allowed in MPC"
    validation:
      gt<>: [ 0 ]
  min_speed:
    type: double
    default_value: 0.5
    description: "minimum allowed vehicle speed [m/s]"
  max_speed:
    type: double
    default_value: 4.0
    description: "maximum allowed vehicle speed [m/s]"
  goal_stop_radius:
    type: double
    default_value: 0.5
    description: "distance [m] to the final goal point within which the MPC commands zero speed; only applies when the goal point is the end of the global path (and, in follower mode, only once the leader has also stopped)"
  use_hard_constraints:
    type: bool
    default_value: false
    description: "whether to include obstacles as hard constraints in addition to soft constraints"
  use_segmentation:
    type: bool
    default_value: false
    description: "Whether to use segmentation data in the MPC planner."
  segmentation_resolution:
    type: double
    default_value: 1.0
    description: "Resolution [m] of the segmentation cells passed to the MPC planner."
  linear_solver:
    type: string
    default_value: "ma27"
    description: "See https://coin-or.github.io/Ipopt/OPTIONS.html#OPT_linear_solver for list of linear solvers. Recommended: 'ma27'. Default: 'mumps'"

  # Objective function weights
  # ====================================================================================================================
  w_distance_to_obstacles:
    type: double
    default_value: 100.0
    description: "weight on distanceToObstacles in the objective function"
  w_distance_to_goal:
    type: double
    default_value: 150.0
    description: "weight on distanceToGoal in the objective function"
  w_deviation_in_yaw:
    type: double
    default_value: 1.0
    description: "weight on deviationInYaw in the objective function"
  w_yaw_accel:
    type: double
    default_value: 0.8
    description: "weight on yawAccel in the objective function"
  w_traversability_cost:
    type: double
    default_value: 0.1
    description: "weight on traversability cost in the objective function"
  w_final_speed:
    type: double
    default_value: 200.0
    description: "weight on deviationFromDesiredFinalSpeed in the objective function"
  w_speed_tracking:
    type: double
    default_value: 0.0
    description: "weight on the squared shortfall of the predicted speed from the speed setpoint (normalized by the setpoint, averaged over the horizon); counters slowing down to keep obstacles out of the fixed-time horizon"
  w_final_heading:
    type: double
    default_value: 100.0
    description: "weight on the terminal heading cost; active only near the end of the global path"

  safety_margin:
    type: double
    default_value: 0.75
    description: "safety margin [m] around obstacles"
  obstacle_cost_speed_floor:
    type: double
    default_value: 2.5
    description: "m/s; obstacle cost can't be bought down by idling below this speed"
  enable_fallback:
    type: bool
    default_value: true
    description: "retry a colliding solve from a steering-mirrored warm start and keep whichever clears the obstacle by more; disable to always use the primary solve"
  grid_resolution:
    type: double
    default_value: 0.25
    description: "resolution of the occupancy grid [m]"

  # Goal point processing (goal_point_processor_node)
  # ====================================================================================================================
  always_publish_goal:
    type: bool
    default_value: false
    description: "always publish goal (overrides front_angle_goal)"
  front_angle_goal:
    type: double
    default_value: 1.571
    description: "the angle measured from the vehicle heading beyond which the goal point is considered not in front of the vehicle [rad]"
  front_angle_obstacle:
    type: double
    default_value: 1.571
    description: "the angle measured from the vehicle heading beyond which an obstacle is considered not in front of the vehicle [rad]"
  front_angle_segmentation:
    type: double
    default_value: 1.571
    description: "the angle measured from the vehicle heading beyond which segmentation data is considered not in front of the vehicle [rad]"
  goal_lookahead_time_padding:
    type: double
    default_value: 0.5
    description: "additional time padding added to the goal lookahead distance [s]"
  use_goal_lookahead_maxspeed:
    type: bool
    default_value: false
    description: "if true the max_speed will be used to select an intermediate waypoint at (planning_horizon+padding)*speed distance along the global path. Else, the current speed will be used."
  use_auto_final_heading:
    type: bool
    default_value: true
    description: "Auto-compute terminal heading from the last two global path waypoints when no manual heading has been set via goal_pose"

  adaptive:
    type: bool
    default_value: false
    description: "whether to use the terrain adaptive formulation or not"

  vehicle_axle_distance_front:
    type: double
    default_value: 1.54134
    description: "Distance from the odometry point to the front axle [m]; the MPC and the obstacle, segmentation and goal point processors shift the odometry position forward by this amount. 0 if the odometry point is the front axle."

  # Vehicle model (MPC dynamics); defaults are for the UM MRZR
  # ====================================================================================================================
  vehicle_cg_to_front_axle_distance:
    type: double
    default_value: 1.54134
    description: "Distance from the CG to the front axle (la) [m]; the CG-to-rear-axle distance is vehicle_wheelbase minus this"
    validation:
      gt<>: [ 0.0 ]
  vehicle_wheelbase:
    type: double
    default_value: 2.71534
    description: "Wheelbase (L) [m]"
    validation:
      gt<>: [ 0.0 ]
  vehicle_cg_height:
    type: double
    default_value: 0.634
    description: "CG height (h_cg) [m]"
    validation:
      gt<>: [ 0.0 ]
  vehicle_mass:
    type: double
    default_value: 1269.0
    description: "Vehicle mass (m) [kg]"
    validation:
      gt<>: [ 0.0 ]
  vehicle_yaw_inertia:
    type: double
    default_value: 1620.0
    description: "Yaw moment of inertia about the CG (Izz) [kg m^2]"
    validation:
      gt<>: [ 0.0 ]

  # Obstacle / segmentation processing (obstacle_processor_node, segmentation_grid_processor_node)
  # ====================================================================================================================
  obstacles_vizualize:
    type: bool
    default_value: true
    description: "Publish obstacle visualization messages"
  traversability_threshold:
    type: int
    default_value: 40
    description: "Segmentation grid value below which a cell is considered non-traversable when projecting segmentation onto the occupancy grid."
    validation:
      bounds<>: [ -1, 100 ]
  project_segmentation_onto_occupancy_grid:
    type: bool
    default_value: true
    description: "If true, non-traversable segmentation cells are projected onto the occupancy grid as obstacles."

  # Terrain limits
  # ====================================================================================================================
  slope_threshold:
    type: double
    default_value: 0.2
    description: "Terrain slope above which the speed is limited to speed_around_large_slopes_and_rms."
  rms_threshold:
    type: double
    default_value: 0.05
    description: "Terrain RMS above which the speed is limited to speed_around_large_slopes_and_rms."
  speed_around_large_slopes_and_rms:
    type: double
    default_value: 4.0
    description: "Speed limit [m/s] applied around large slopes and high RMS terrain."

  # MPC constraints
  # ====================================================================================================================
  sa_min:
    type: double
    default_value: -0.628319
    description: "Minimum steering angle constraint for MPC planner"
  sa_max:
    type: double
    default_value: 0.628319
    description: "Maximum steering angle constraint for MPC planner"
  sr_min:
    type: double
    default_value: -0.523
    description: "Minimum steering rate constraint for MPC planner"
  sr_max:
    type: double
    default_value: 0.523
    description: "Maximum steering rate constraint for MPC planner"
  ax_max:
    type: double
    default_value: 10.0
    description: "Maximum longitudinal acceleration constraint [m/s^2]; also used by goal_point_processor for kinematic lookahead"

  # Obstacle corridor culling
  # ====================================================================================================================
  use_corridor_culling:
    type: bool
    default_value: false
    description: "Filter obstacles to those within corridor_half_width of the previous MPC trajectory"
  corridor_half_width:
    type: double
    default_value: 10.0
    description: "Half-width of the trajectory corridor [m]; obstacles outside are dropped before the NLP"
  visualize_culled_obstacles:
    type: bool
    default_value: true
    description: "Publish culled obstacle clusters as red MarkerArray on avt_341/culled_obstacle_markers"

  publish_steering_commands:
    type: bool
    default_value: true
    description: "If true, the MPC planner publishes steering commands on avt_341/cmd_steer."
