code_namespace: avt_341_nav/params/speed_zones
ros__parameters:

  # Speed zones
  # ====================================================================================================================
  zones_filepath:
    type: string
    default_value: ''
    description: "Path to the speed zones csv file. Empty by default; the launch system / parameter override supplies the actual path (legacy config resolved 'krc_speed_zones - NAD83_m.csv' from the package config directory)."
  zones_frame:
    type: string
    default_value: 'nad83'
    description: "Reference frame in which the speed zone corner coordinates are defined."
  local_frame:
    type: string
    default_value: 'map'
    description: "Local frame used when transforming speed zones."
  vehicle_odom_topic:
    type: string
    default_value: 'avt_341/odometry'
    description: "Vehicle odometry topic used to track the vehicle position within the speed zones."
  zone_speeds:
    type: double_array
    default_value: [4.0, 8.0, 12.0, 4.0, 8.0]
    description: "Speed for each zone index [m/s]. Zone: 0 | 1 | 2 | 3 | 4. Zones from 'krc_speed_zones - NAD83_m.csv': 0: North lot, 1: Entry gate road / VDA 1, 2: Access road south of VDA 1, 3: Offroad trail, 4: Loop 1 / RMS Lanes / VDA 2 / Circle Tracks / Access road from RMS lanes to Peat Pit."
    validation:
      not_empty<>: null
