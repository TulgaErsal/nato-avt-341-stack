code_namespace: avt_341_nav/params/mission_manager
ros__parameters:

  __include_mixins: coordinate_frames_mixin

  # Costmap transport (publish.method drives latching of grid subscriptions)
  costmap:
    __include_mixins: costmap_publish_mixin

  name:
    type: string
    description: "Vehicle name / id of this mission manager instance. Supplied by the launch system as the uppercased vehicle id."
  vehicle_namespaces:
    type: string_array
    description: "Namespaces of all vehicles in the formation, in formation order. Used to subscribe to per-vehicle odometry topics."
  max_speed:
    type: double
    default_value: 4.0
    description: "Default maximum vehicle speed (m/s). Single source for the mpc planner family and the mission manager."
  mission_definition_file:
    type: string
    default_value: ''
    description: "File describing mission reference points. The deployment override yaml supplies the actual path."
  mission_paths_file:
    type: string
    default_value: ''
    description: "File describing paths of mission points. The deployment override yaml supplies the actual path."
  use_speed_zones:
    type: bool
    default_value: true
    description: "Enable the speed zone monitor, which sets the speed setpoint from the zone the vehicle is in."
  speed_zones_file:
    type: string
    default_value: ''
    description: "Polygon zone json file defining speed zones (max_speed per zone). Empty disables speed zone monitoring. The deployment override yaml supplies the actual path."
  check_goal_arrival:
    type: bool
    default_value: false
    description: "Check if the current goal has been reached."
  goal_arrival_distance:
    type: double
    default_value: 5.0
    description: "Distance (m) to current goal for arrival when check_goal_arrival is enabled."

  formation:
    follow_scale_x:
      type: double
      default_value: 15.0
      description: "X scale distance between vehicles in formation in vehicle coordinates."
    follow_scale_y:
      type: double
      default_value: 10.0
      description: "Y scale distance between vehicles in formation in vehicle coordinates."
    global_path_points_dist:
      type: double
      default_value: 1.0
      description: "Distance (m) between generated global path points."
    use_breadcrumbs:
      type: bool
      default_value: false
      description: "If true, follower vehicles use leader breadcrumbs as their global path. If false, followers use the global planner."
    x_offset_on_path:
      type: bool
      default_value: true
      description: "If true, follower x-offset is applied along leader path length. Otherwise it is applied from snapshot poses of the leader."
    prune_global_path:
      type: bool
      default_value: true
      description: "If true, prune the formation-controller follower path to its closest point."
    use_tangent_heading:
      type: bool
      default_value: false
      description: "If true, estimate leader heading from the position-history tangent instead of the odometry orientation."
    follow_goal_threshold:
      type: double
      default_value: 10.0
      description: "Terminal goal threshold for an ALL_ARRIVE follow task, checked after the followed vehicle arrives."

  # Formation Speed Control Settings
  # ====================================================================================
  fsc:
    type:
      type: string
      default_value: 'speed_up_follower'
      description: "Formation speed controller: 'speed_up_follower' | 'slow_down_leader' | 'none'."
      validation:
        one_of<>: [ [ 'speed_up_follower', 'slow_down_leader', 'none' ] ]
    max_speed_factor:
      type: double
      default_value: 1.2
      description: "Maximum speed factor the formation speed controller may command."
    follower_obt_stop:
      type: bool
      default_value: false
      description: "If true, stop the follower when the formation speed controller detects an obstruction."
    debug_visualize:
      type: bool
      default_value: false
      description: "Visualize formation speed-control diagnostics."
    follower_dist_break:
      type: double
      default_value: 10.0
      description: "If follower global-path distance is less than this amount, the follower waits."
    follower_dot_threshold:
      type: double
      default_value: 0.0
      description: "Heading dot-product threshold below which the follower waits."
    follower_dot_range:
      type: double
      default_value: 100.0
      description: "Range within which the heading dot-product filter is applied."

    # FSC/Out-of-Formation Settings
    # ====================================================================================
    oof:
      threshold:
        type: double
        default_value: 7.0
        description: "Distance after which a vehicle is considered out of formation."
      const_term:
        type: double
        default_value: 0.3
        description: "Initial speed-factor subtraction after passing the out-of-formation threshold."
      lin_slope:
        type: double
        default_value: 0.03
        description: "Slope in the linear portion of out-of-formation speed control."
      mult:
        type: double
        default_value: 0.14
        description: "Multiplier applied to vehicles that are out of formation."

  # Target of Interest Settings
  # ====================================================================================
  toi:
    approach_dist:
      type: double
      default_value: 20.0
      description: "Approach distance to a target of interest before encircling."
    approach_speed:
      type: double
      default_value: 3.5
      description: "Speed limit [m/s] while approaching a target of interest (a slower mission speed is kept); 0 keeps the mission's. The vehicle can only coast to the encircle speed, so a slower approach leaves less to shed once the encircle starts."
      validation:
        gt_eq<>: [ 0.0 ]
    encircle_radius:
      type: double
      default_value: 7.0
      description: "Encircle radius around a target of interest."
    encircle_degrees:
      type: double
      default_value: 270.0
      description: "Angular range to encircle around a target of interest (at most one full loop)."
      validation:
        bounds<>: [ 0.0, 360.0 ]
    encircle_cw:
      type: bool
      default_value: true
      description: "If true, encircle the target of interest clockwise."
    goal_threshold:
      type: double
      default_value: 2.5
      description: "Distance at which the vehicle is considered to have approached the target of interest. Coming this close to the end of an encircle path, having been farther from it, ends the encircle."
    encircle_speed:
      type: double
      default_value: 2.5
      description: "Speed limit [m/s] while encircling a target of interest (a slower mission speed is kept); 0 keeps the mission's. The MPC heads for a goal point the goal point processor picks speed x (prediction_time_horizon + goal_lookahead_time_padding) metres along the circle, so a slower encircle keeps that goal closer and the vehicle on the circle."
      validation:
        gt_eq<>: [ 0.0 ]
    encircle_blocked_time:
      type: double
      default_value: 3.0
      description: "An encircle is abandoned (its target counted as investigated) once at least encircle_blocked_fraction of the next encircle_blocked_lookahead metres of the circle has had an occupied cell of avt_341/occupancy_grid within encircle_blocked_clearance for this long [s]. 0 never abandons it."
      validation:
        gt_eq<>: [ 0.0 ]
    encircle_blocked_lookahead:
      type: double
      default_value: 10.0
      description: "Length of the circle ahead of the vehicle checked for obstacles [m] (see encircle_blocked_time)."
      validation:
        gt<>: [ 0.0 ]
    encircle_blocked_fraction:
      type: double
      default_value: 0.5
      description: "Fraction of the circle ahead that must be blocked (see encircle_blocked_time)."
      validation:
        bounds<>: [ 0.0, 1.0 ]
    encircle_blocked_clearance:
      type: double
      default_value: 0.75
      description: "A circle pose is blocked when an occupied cell lies within this distance of it [m] (see encircle_blocked_time)."
      validation:
        gt_eq<>: [ 0.0 ]
    encircle_tangent_entry:
      type: bool
      default_value: false
      description: "If true, an encircle starting outside its circle first drives straight to the circle's tangent point in the encircle direction, then along the circle. The bearing swept along that line counts toward encircle_degrees, so the path ends where it would without it. If false, the circle starts at the vehicle's bearing from the target."
    encircle_stall_time:
      type: double
      default_value: 7.0
      description: "An encircle is abandoned (its target counted as investigated) once the vehicle has swept no further around the target for this long with autonomy enabled [s]. 0 never abandons it."
      validation:
        gt_eq<>: [ 0.0 ]
    encircle_replan_distance:
      type: double
      default_value: 2.0
      description: "Once an encircle is running, a contact position update that moves the target at least this planar distance [m] re-plans the rest of the circle around the new position. 0 keeps the circle fixed."
      validation:
        gt_eq<>: [ 0.0 ]
    contact_trigger_delay:
      type: double
      default_value: 1.0
      description: "Seconds a contact must persist before MoveTo and Encircle tasks are created (0 triggers immediately)."
    same_object_distance_threshold:
      type: double
      default_value: 5.0
      description: "Two reports, or a report and a contact, can be the same target when their positions come within this planar distance [m] and a camera range is involved; see lidar_same_object_distance between two LiDAR positions. A camera-ranged position counts as the stretch of its line of sight given by camera_extent_near_fraction. A report that can be exactly one contact goes to it; one that can be several is dropped; one that can be none is a new contact. Applied to the object tracking node's target_selection.same_object_distance together with each toi_regex."
      validation:
        gt_eq<>: [ 0.0 ]
    lidar_same_object_distance:
      type: double
      default_value: 7.0
      description: "Same-target distance [m] between two LiDAR-ranged positions (see same_object_distance_threshold): the LiDAR box center of a car moves by up to about 6 m as the vehicle drives around it. Applied to the object tracking node's target_selection.investigated_toi_radius together with each toi_regex."
      validation:
        gt_eq<>: [ 0.0 ]
    camera_extent_near_fraction:
      type: double
      default_value: 0.4
      description: "A camera-ranged report places its target on the stretch of the line of sight from this fraction of the range nearer than the estimate (at most camera_extent_near_max) to camera_extent_far_fraction farther (at most camera_extent_far_max): the camera range reads long, by up to about 40 % for a clipped detection. Targets must be farther apart than the reach of the stretch plus same_object_distance_threshold (25 m with the defaults). Applied to the object tracking node together with each toi_regex."
      validation:
        gt_eq<>: [ 0.0 ]
    camera_extent_near_max:
      type: double
      default_value: 15.0
      description: "See camera_extent_near_fraction [m]."
      validation:
        gt_eq<>: [ 0.0 ]
    camera_extent_far_fraction:
      type: double
      default_value: 0.1
      description: "See camera_extent_near_fraction."
      validation:
        gt_eq<>: [ 0.0 ]
    camera_extent_far_max:
      type: double
      default_value: 5.0
      description: "See camera_extent_near_fraction [m]."
      validation:
        gt_eq<>: [ 0.0 ]
    team_vehicle_exclusion_radius:
      type: double
      default_value: 5.0
      description: "Target contacts within this planar distance [m] of any team vehicle (including the ego vehicle) are ignored, so team members detected as targets of interest are not investigated. 0 disables the filter."
      validation:
        gt_eq<>: [ 0.0 ]
    team_vehicle_line_of_sight_lateral:
      type: double
      default_value: 3.5
      description: "Target contacts within this planar distance [m] of the line of sight from the ego vehicle to another team vehicle, and within team_vehicle_line_of_sight_range_fraction of its range (at least team_vehicle_line_of_sight_min_range), are also ignored as that team vehicle: the camera's bearing to a target is good, its range estimate is not. A track with such a report before its contact's tasks exist is a team vehicle; its contact is forgotten and its later reports are ignored (see team_vehicle_track_clear_reports). 0 disables this gate, as does team_vehicle_exclusion_radius 0."
      validation:
        gt_eq<>: [ 0.0 ]
    team_vehicle_line_of_sight_range_fraction:
      type: double
      default_value: 0.35
      description: "Range tolerance of the line-of-sight team vehicle gate, as a fraction of the range from the ego vehicle to the team vehicle (see team_vehicle_line_of_sight_lateral)."
      validation:
        gt_eq<>: [ 0.0 ]
    team_vehicle_line_of_sight_min_range:
      type: double
      default_value: 7.0
      description: "Smallest range tolerance [m] of the line-of-sight team vehicle gate (see team_vehicle_line_of_sight_lateral)."
      validation:
        gt_eq<>: [ 0.0 ]
    team_vehicle_track_clear_reports:
      type: int
      default_value: 2
      description: "A track ignored as a team vehicle is a target again after this many consecutive reports clear of every other team vehicle: outside team_vehicle_exclusion_radius of it and outside its line-of-sight gate scaled by team_vehicle_track_clear_scale. A target that is on the line of sight to a team vehicle when first reported is then investigated once the vehicles move on. 0 ignores the track for good."
      validation:
        gt_eq<>: [ 0 ]
    team_vehicle_track_clear_scale:
      type: double
      default_value: 2.0
      description: "A report counts as clear of a team vehicle (see team_vehicle_track_clear_reports) outside the line-of-sight gate scaled by this factor: team_vehicle_line_of_sight_lateral, _range_fraction and _min_range all multiplied by it. A team vehicle's reports stay near its line of sight and its range however wrong the camera range; a target's leave once the vehicles move on."
      validation:
        gt_eq<>: [ 1.0 ]
    autonomy_topic:
      type: string
      default_value: '/autonomy_enabled'
      description: "std_msgs/Bool topic reporting whether the vehicle is under autonomous control; no investigation is started while it reports false (none is started without an active task either). Empty, or no message, leaves investigations enabled."
    tracker_node_name:
      type: string
      default_value: 'object_tracker_node'
      description: "Object tracking node whose target_selection.toi_regex (and its same-target settings, see same_object_distance_threshold) is reconfigured when the task of a FORM, MOVETO or PATH_FOLLOW command with a non-empty toi_regex starts ('^$' disables targets of interest). Relative names resolve under this vehicle's namespace."

  use_avt_tracker:
    type: bool
    default_value: true
    description: "Use avt_341/odometry/estimated/<vehicle> instead of cross-namespace ground truth for other vehicles."
  formation_goal_filter:
    type: string
    default_value: 'none'
    description: "Formation goal filtering method: 'none' | 'obs_avoid'."
    validation:
      one_of<>: [ [ 'none', 'obs_avoid' ] ]

  # Formation Goal Filter - Obstacle Avoidance Settings
  fgf_obs_avoid:
    occ_threshold:
      type: int
      default_value: 0
      description: "Threshold for occupancy cells to be considered an obstacle."
    padding:
      type: double
      default_value: 1.0
      description: "Additional obstacle padding (m) beyond perception-grid dilation."
    pub_unfiltered_goal:
      type: bool
      default_value: false
      description: "Publish the unfiltered formation goal for debugging while continuing to use the filtered goal."
    patch_pad_width:
      type: double
      default_value: 20.0
      description: "Occupancy-grid patch width (m) searched for free cells when the candidate goal is occupied."
    min_obstacle_width:
      type: double
      default_value: 5.0
      description: "Minimum obstacle width (m) considered by deadlock detection."
    follower_divergence_threshold:
      type: double
      default_value: 30.0
      description: "Distance (m) after which a processed follower goal is considered to diverge from the leader path."
    reset_side_on_free_space:
      type: bool
      default_value: true
      description: "Reset sidedness state when the candidate goal is in free space."
    persist_state:
      type: bool
      default_value: true
      description: "Persist goal-filter state between invocations."
    ignore_deadlock:
      type: bool
      default_value: true
      description: "Ignore deadlock and reset the internal filter state."

  formation_change_delay:
    is_enabled:
      type: bool
      default_value: false
      description: "If true, i-th vehicle in formation will wait for i*delay seconds before changing formation."
    delay:
      type: double
      default_value: 5.0
      description: "Delay (s) between formation changes for ith vehicle."
