code_namespace: avt_341_nav/params/pf_local_planner
ros__parameters:

  # Costmap transport (publish.method drives latching of grid subscriptions)
  costmap:
    __include_mixins: costmap_publish_mixin

  # Potential Field Local Planner
  # ====================================================================================================================
  use_global_path:
    type: bool
    default_value: true
    description: "Whether local planner should use path output from global planner for its road centerline or use simple line connecting waypoints"
  rate:
    type: double
    default_value: 10.0
    description: "Planning rate"
    validation:
      gt_eq<>: [ 0.0 ]
  obstacle_cost_thresh:
    type: int
    default_value: 50
    description: "Threshold for making something an obstacle (0-100), primarily for use with segmentation grid"
    validation:
      bounds<>: [ 0, 100 ]
  kp:
    type: double
    default_value: 10.0
    description: "Attractive potential coeff"
  eta:
    type: double
    default_value: 7.5
    description: "Repulsive potential coeff"
  cutoff_dist:
    type: double
    default_value: 40.0
    description: "obstacles farther than this are ignored"
  inner_cutoff_dist:
    type: double
    default_value: 0.0
    description: "Obstacles closer than this are ignored"
  motion_model_res:
    type: double
    default_value: 0.25
    description: "Step size for the motion model in meters"
  grid_topic:
    type: string
    default_value: "avt_341/occupancy_grid"
    description: "Occupancy grid topic"
