class_name: CoordinateFramesParams
code_namespace: avt_341_nav/params/core
ros__parameters:
    frames:
        use_vehicle_prefix:
            type: bool
            default_value: true
            description: "If true, the camera, lidar, base_link and cg tf frames are prefixed with the vehicle id."
        camera:
            type: string
            default_value: 'camera'
            description: "Camera sensor frame on vehicle."
        lidar:
            type: string
            default_value: 'lidar'
            description: "Lidar sensor frame on vehicle."
        base_link:
            type: string
            default_value: 'base_link'
            description: "Vehicle base link frame."
        cg:
            type: string
            default_value: ''
            description: "Tf frame for the center of gravity of the vehicle."
        map:
            type: string
            default_value: 'map'
            description: "Environment map frame."
        odom:
            type: string
            default_value: 'odom'
            description: "Odometry frame."
        gis:
            crs:
                type: string
                default_value: ''
                description: "GIS coordinate reference system."
            origin_x:
                type: double
                default_value: 0.0
                description: "Local origin x offset in crs to where origin of the map frame is located."
            origin_y:
                type: double
                default_value: 0.0
                description: "Local origin y offset in crs to where origin of the map frame is located."
