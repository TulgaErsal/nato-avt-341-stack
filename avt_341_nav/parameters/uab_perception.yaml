code_namespace: avt_341_nav/params/uab_perception
ros__parameters:

  __include_mixins: coordinate_frames_mixin

  # Grid
  # ====================================================================================================================
  costmap:
    __include_mixins: costmap_geometry_mixin, costmap_publish_mixin

  publish_uab_occupancy_grid:
    type: bool
    default_value: false
    description: "If true, publishes the UAB occupancy grid."
  default_terrain_cost:
    type: int
    default_value: 50
    description: "Terrain cost assigned to a cell before it has been classified. Lower costs indicate more traversable terrain (e.g. roads), higher costs indicate less traversable terrain (e.g. grass); 50 is a neutral midpoint. Independent of the global planner's no_segmentation_data_cost param, which covers cells this node hasn't published data for at all."

  # Topics
  # ====================================================================================================================
  camera_topic:
    type: string
    default_value: 'avt_341/camera/image_raw'
    description: "Input camera image topic. Debug segmentation topics are derived from it by replacing the final path segment."

  # Segmentation and display
  # ====================================================================================================================
  brightness_offset:
    type: double
    default_value: 75.0
    description: "Brightness offset applied to the camera image."
  publish_window:
    type: bool
    default_value: true
    description: "If true, publishes the perception display window."
  debug_vis_segmentation:
    type: bool
    default_value: false
    description: "If true, publishes debug segmentation and segmentation overlay image topics derived from camera_topic."
