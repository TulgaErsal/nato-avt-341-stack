# Global runtime parameters: the wildcard section applies to every node of
# every agent. Entries a given node does not declare stay dormant.
#
# ROS 2 applies matching sections broadest first, so this /** section is applied
# before any narrower selector no matter which file that one is in. Document
# order and then file order decide only between sections sharing one selector.
/**:
  ros__parameters:
    cruise_speed: 2.5
    planner_mode: graph
    rate: 20.0

# Single node across all agents: applies to the controller node of every
# agent namespace
/**/controller:
  ros__parameters:
    cruise_speed: 1.8
