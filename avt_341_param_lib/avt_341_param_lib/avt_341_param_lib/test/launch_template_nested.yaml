# Synthetic parameter template fixture for launch_params_test.py.
#
# This file is OWNED BY THE TESTS and must not be treated as a deployment
# parameter template. It is deliberately shaped like a real node template --
# several levels of nesting, multi-word group names, a mixin include, and a
# spread of scalar types -- so the tests can check that one complete template
# flows correctly through spec loading, launch-argument naming and C++ code
# generation. The parameter names are invented; do not replace them with names
# from a real node, and do not edit this file to track a node's parameter
# change. The expectations in the test module are pinned to these contents.
#
# Companion fixture: mixins/fixture_geometry_mixin.yaml

class_name: Params
code_namespace: nested_fixture

ros__parameters:

  # Top-level scalar, for contrast with the nested groups below.
  update_rate:
    type: double
    default_value: 10.0
    description: "Fixture top-level scalar."

  # Single-word group -> struct Tracking
  tracking:
    target_timeout:
      type: double
      default_value: 1.5
      description: "Fixture nested double."
    max_targets:
      type: int
      default_value: 8
      description: "Fixture nested int."

  # Multi-word group -> struct TargetSelection (snake_case to PascalCase)
  target_selection:
    formation_vehicle_ids:
      type: string_array
      default_value: []
      description: "Fixture nested string array."
    enabled:
      type: bool
      default_value: true
      description: "Fixture nested bool."

  # Three levels deep -> struct Fsc containing struct Oof. Note `type` is also
  # used here as a parameter name, which the group/parameter detection must not
  # confuse with a type declaration.
  fsc:
    type:
      type: string
      default_value: "none"
      description: "Fixture parameter literally named 'type'."
    oof:
      threshold:
        type: double
        default_value: 0.75
        description: "Fixture third-level double."

  # Group mixing spliced-in mixin content with its own nested groups.
  costmap:
    __include_mixins: fixture_geometry_mixin
    thresholds:
      thresh:
        type: float
        default_value: 0.5
        description: "Fixture nested float."
    # Multi-word group -> struct TerrainRms
    terrain_rms:
      hfov:
        type: float
        default_value: 1.57
        description: "Fixture nested float under a multi-word group."
